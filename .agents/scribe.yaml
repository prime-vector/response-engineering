# Scribe
#
# Writes the record that in the source pattern was never written. Two jobs:
# the incident timeline, assembled live from typed inputs rather than from
# memory afterwards, and the draft change record for any directed production
# change. It is the only agent bound to the incident_record sink, and the
# sink is the point: change_draft produces a draft, record_update appends to
# the record, and no tool on that surface submits anything. Submission is a
# human action, always.
#
#   oa validate --spec .agents/scribe.yaml
#
open_agent_spec: "1.6.0"

agent:
  name: scribe
  description: >
    Maintains the incident record. Assembles the timeline from the evidence
    and board state it is given, files it on the incident record, and drafts
    the change record for directed production changes. Drafts only: nothing
    this agent produces is submitted, approved or closed by it.
  # OAS role enum is fixed: analyst, reviewer, chat, retriever, planner,
  # executor. "executor" is the closest fit: this is the only agent that
  # writes anywhere, and everything it writes is a draft or a record append.
  role: executor

intelligence:
  type: llm
  engine: anthropic
  # Explicit because the runner's fallback endpoint is OpenAI's even for the
  # anthropic engine, which turns into a bodyless 404 at run time.
  endpoint: https://api.anthropic.com/v1
  model: claude-sonnet-4-6
  config:
    temperature: 0.2
    # The timeline is generated twice in one response budget: once as the
    # record_update tool call's arguments and once as the final JSON reply,
    # and a live board grows both. At 8000 a composed run truncated inside
    # the tool call and the runner failed open to an empty, exit-zero
    # output. Headroom is a correctness setting here.
    max_tokens: 16000
    # Provider HTTP read timeout, matching the other specs.
    timeout: 300

# Sink only. The Scribe consumes what the other agents produced through its
# input fields and owns no evidence surface: a scribe that can query
# telemetry starts editorialising, and the record must be assembled from
# what the investigation actually held at the time.
tools:
  incident_record:
    type: mcp
    endpoint: http://localhost:8425
    description: >
      Platform-agnostic record sink. Drafts and record updates only; the
      surface deliberately has no submit call. See interfaces/TELEMETRY.md.
      Mock adapter at mock/adapter.py, vendor adapters implement the same
      tool surface.
    timeout: 30

tasks:

  timeline:
    # Task-level rather than root-level: the runner merges a root contract
    # into every task with arrays unioned, which would bind
    # draft_change_record to this task's required fields.
    behavioural_contract:
      version: "1.0"
      description: >
        Enforces that the timeline is a record, not a narrative. Every entry
        cites its source and carries its confidence, evidence never
        collected appears as gaps rather than disappearing, and the result
        is filed on the incident record rather than left in the chat.
      role: "Incident scribe"
      behavioural_flags:
        conservatism: "high"
        verbosity: "balanced"
        temperature_control:
          mode: "strict"
          range: [0.0, 0.3]
      response_contract:
        output_format:
          required_fields:
            - entries
            - gaps
            - record_updated
    description: >
      Assemble the incident timeline from the view and board state provided,
      then file it on the incident record with record_update. Entries come
      only from the input; what was never collected is recorded as a gap.
    # Generous for the same reason as max_tokens: a composed run carries the
    # live board and the reply is timeline-sized twice over.
    timeout: 300
    # Tool binding is per task. Without this list the runner attaches nothing.
    tools: [incident_record]
    # Task-level rather than root-level: the runner merges a root sandbox into
    # every task, each of tools, http and file replacing the root key of the
    # same name wholesale, so a root boundary is one a future task inherits
    # without declaring it. Duplicated onto draft_change_record rather than
    # rooted, for that reason. Sink tools only: every one produces a draft or
    # an append, none submits.
    sandbox:
      tools:
        allow: [record_create, record_update, change_draft]
      http:
        # Constrains only the runner's generic http.* tools, which this task
        # does not bind; MCP calls are gated by the tool allow list above. The
        # runner matches hostnames with the port stripped, so this cannot pin
        # ports: a second fence, not a boundary.
        allow_domains: [localhost]
      file:
        allow_paths: ["./fixtures/"]
    input:
      type: object
      properties:
        as_of:
          type: string
          description: >
            The moment this record represents. Nothing after this timestamp
            exists yet, however obtainable it may appear.
          minLength: 1
        incident_id:
          type: string
          description: >
            Opaque incident reference, used as the record_ref for filing.
        symptom:
          type: string
          description: What was reported, in the words it was reported in
        entity:
          type: object
          description: The affected entity, its capacity and its standing conditions
        signals:
          type: array
          description: >
            Observations available at this point in time. Each carries
            source, timestamp and whether a human has consumed it.
          items:
            type: object
        evidence:
          type: array
          description: >
            Evidence actually collected. Anything not present here was not
            held by the investigation, however obtainable it may appear.
          items:
            type: object
        missing_evidence:
          type: array
          description: Evidence requested or obtainable but never collected
          items:
            type: object
        changes:
          type: array
          description: Change and package install history for the entity
          items:
            type: object
        board:
          type: object
          description: >
            The commander's current board: hypotheses with their confidence,
            blocking evidence, convergence ruling. Pass {} when no board
            exists yet.
        mitigation_attempts:
          type: array
          description: >
            Directed changes and their outcomes, including ones blocked
            pending authorisation. A blocked attempt is a timeline event.
            Pass [] when there are none.
          items:
            type: object
      # Every templated variable is required, deliberately: the runner
      # renders {{ placeholders }} only from keys present in the input and
      # passes missing ones through as literal text, which degrades the run
      # silently. An absent-but-empty input is passed as {} or [], never
      # omitted.
      required: [as_of, incident_id, symptom, entity, signals, evidence,
                 missing_evidence, changes, board, mitigation_attempts]
    output:
      type: object
      properties:
        entries:
          type: array
          description: >
            The timeline, chronological. Every entry is traceable to the
            input; an event no signal, evidence item or board field records
            does not exist.
          items:
            type: object
            properties:
              at:
                type: string
                description: Timestamp verbatim from the source material
              event:
                type: string
                description: What happened, stated so it can be checked
              source:
                type: string
                description: >
                  Where this entry comes from in the input: the signal,
                  evidence item, change record or board field. An entry
                  that cannot name its source does not go on the timeline.
              consumed_by_human:
                type: boolean
                description: >
                  For detections and reports: whether any human
                  acknowledged, assigned or actioned it. False is the
                  finding that matters most.
              confidence:
                type: string
                description: >
                  One of: speculative, plausible, likely, supported,
                  confirmed. An entry read directly from a record in the
                  input can be confirmed. An entry carrying a claim from
                  the board keeps that claim's confidence verbatim, never
                  upgraded and never stripped.
                enum: [speculative, plausible, likely, supported, confirmed]
              falsifying_test:
                type: string
                description: >
                  The observation that would remove this entry from the
                  record, typically the source record showing otherwise.
            required: [at, event, source, confidence, falsifying_test]
        gaps:
          type: array
          description: >
            Evidence that was obtainable or requested but never collected.
            The gaps are as much a part of the record as the entries: a
            timeline that omits what was never done reads as complete when
            it is not.
          items:
            type: object
            properties:
              description:
                type: string
              how_to_obtain:
                type: string
              obtainable_since:
                type: string
              still_outstanding:
                type: boolean
            required: [description, how_to_obtain]
        record_ref:
          type: string
          description: The reference returned by the sink when the timeline was filed
        record_updated:
          type: boolean
          description: >
            True only if record_update succeeded. A timeline that was not
            filed is a chat message, not a record; say so honestly.
      required: [entries, gaps, record_ref, record_updated]

  draft_change_record:
    # Act three's closer: the change record that in the source pattern was
    # never written. Input shape matches fixtures/mitigation-directive.json
    # so the same directed change the sandbox blocks is the change this
    # task documents.
    behavioural_contract:
      version: "1.0"
      description: >
        Enforces that a change record cannot understate what it changes or
        overstate what is known. The draft carries its risk, blast radius,
        backout and validation in full, cause_status cannot silently become
        confirmed, and the schema pins submitted false: there is no path
        from this agent to a submitted change.
      role: "Incident scribe"
      behavioural_flags:
        conservatism: "high"
        verbosity: "balanced"
        temperature_control:
          mode: "strict"
          range: [0.0, 0.3]
      response_contract:
        output_format:
          required_fields:
            - summary
            - risk
            - blast_radius
            - backout_plan
            - validation_plan
            - authorisation_required
            - submitted
            - draft_ref
    description: >
      Produce the draft change record for a directed production change,
      lodge it with change_draft, and report the draft reference. The draft
      documents the change honestly, including what it destroys and whether
      it silently reverts. Submission is a human action, always.
    timeout: 120
    tools: [incident_record]
    # Declared here as well as on timeline rather than at spec root: a root
    # sandbox is a boundary a future task inherits without declaring it, and
    # the duplication is what keeps each task's boundary readable beside its
    # binding. Sink tools only, none of which submits.
    sandbox:
      tools:
        allow: [record_create, record_update, change_draft]
      http:
        allow_domains: [localhost]
      file:
        allow_paths: ["./fixtures/"]
    input:
      type: object
      properties:
        proposed_action:
          type: string
          description: The change the bridge has directed, verbatim
          minLength: 1
        directed_by:
          type: string
        justification:
          type: string
        entity:
          type: object
          description: The affected entity, its capacity and its standing conditions
        board:
          type: object
          description: >
            The commander's current board. cause_status may only be
            confirmed when this board confirms it; pass {} when no board
            exists, and the cause stays unconfirmed.
      # Every templated variable is required; see the timeline task's input
      # for why. fixtures/mitigation-directive.json carries all five.
      required: [proposed_action, directed_by, justification, entity, board]
    output:
      type: object
      properties:
        change_type:
          type: string
          description: One of - emergency, normal, standard
        summary:
          type: string
          maxLength: 300
        description:
          type: string
          description: >
            The change in full: what is modified, on what, by whom, and the
            mechanism. Runtime-only changes say so explicitly, including
            what the persistent configuration still reads.
        risk:
          type: string
          description: >
            What this change puts at risk, stated plainly. If the change
            stops evidence being collectable, the record names which
            evidence and what question it would have settled.
        blast_radius:
          type: string
        implementation_plan:
          type: array
          items:
            type: string
        backout_plan:
          type: string
          description: >
            How the change is reversed, and whether reversal happens by
            itself. A change that silently reverts on reboot has an
            automatic backout that is also an unplanned risk; the record
            says both.
        validation_plan:
          type: string
          description: >
            The falsifying test of the change itself: the observation that
            shows it worked, and the observation that shows it did not.
        cause_status:
          type: string
          # Enum rather than description: a third word is rejected at the
          # schema layer, same as the other pins.
          enum: [unconfirmed, confirmed]
          description: >
            Confirmed only when the input board carries a confirmed
            hypothesis with convergence allowed. A change record is where a
            mitigation is documented, never where a cause is established,
            and a suppression with the cause unconfirmed is recorded as
            exactly that.
        cause_basis:
          type: string
          description: >
            Required when cause_status is confirmed: the board's confirmed
            hypothesis and its direct evidence, quoted verbatim. If the
            board does not contain them, this field cannot honestly be
            written. A quote is checkable against the board after the
            fact, which is what makes fabricating one a detectable act
            rather than a silent omission.
        authorisation_required:
          # Pinned by schema, not left to judgement: this task documents
          # directed production changes, and a draft claiming a production
          # change needs no authorisation is the failure mode itself.
          type: boolean
          const: true
        approvals_required:
          type: array
          description: The human roles whose approval submission needs
          items:
            type: string
        draft_ref:
          type: string
          description: The reference returned by change_draft for this draft
        submitted:
          # The structural version of "submission is a human action": a
          # draft that claims submission is rejected at the schema layer,
          # and no tool on the sink surface can submit regardless.
          type: boolean
          const: false
      required:
        - change_type
        - summary
        - description
        - risk
        - blast_radius
        - implementation_plan
        - backout_plan
        - validation_plan
        - cause_status
        - authorisation_required
        - submitted
        - draft_ref
      # Rule 6 of the task prompt, structurally, matching the commander's
      # attribution pattern: a record claiming a confirmed cause must carry
      # the board material it is confirmed from. Same class of control as
      # the attribution guard, and the same honest limit: the basis cannot
      # be silently omitted, but a model intent on confirming could still
      # fabricate one against an empty board. This pin forces the record,
      # not the truth of it; content stays the model's judgement. Do not
      # sell it as a peer of the submitted/authorisation_required pins.
      allOf:
        - if:
            properties:
              cause_status:
                const: confirmed
            required: [cause_status]
          then:
            required: [cause_basis]
    prompts:
      system: |
        You are the incident scribe drafting a change record for a directed
        production change. You document the change honestly and completely.
        You never submit it.

        Your operating rules, in priority order:

        1. Draft, never submit. submitted is false, always. No tool
           available to you can submit, and that is the design, not a
           limitation to work around. Submission and approval are human
           actions in the record system.

        2. The change is a production change, so authorisation_required is
           true and approvals_required names the human roles. A directed
           change is still an unauthorised change until a human approves it.

        3. State what the change destroys, not only what it fixes. If the
           change stops evidence being collectable, name the evidence and
           the question it would have settled. Removing a symptom and
           destroying the means of diagnosis in the same command belongs in
           the risk field, in plain words.

        4. Backout is stated with its failure mode. A runtime-only change
           silently reverts on reboot: that is an automatic backout and an
           unplanned risk at once, and the record says both, including what
           the persistent configuration still reads while the runtime
           differs.

        5. The validation plan is the falsifying test of the change: the
           observation that shows it worked and the observation that shows
           it did not. "Monitor the host" is not a validation plan.

        6. cause_status stays unconfirmed unless the board you are given
           carries a confirmed hypothesis with convergence allowed. If you
           set it to confirmed, cause_basis must quote that hypothesis and
           its direct evidence from the board verbatim; the output is
           rejected without it. Never name a third party as cause in any
           field. If the change removes a symptom while the cause is
           unconfirmed, the record says the cause is unconfirmed, in those
           words.

        7. Lodge the draft. Call change_draft with the complete draft and
           report the returned reference in draft_ref. Do not report until
           change_draft has returned a reference: a draft_ref you did not
           receive from the tool is a fabricated record. If the sink
           refuses the draft as incomplete, complete the draft; do not
           argue with the refusal.

        Your entire reply must be a single JSON object with exactly these
        top-level keys: change_type, summary, description, risk,
        blast_radius, implementation_plan, backout_plan, validation_plan,
        cause_status, authorisation_required, approvals_required,
        draft_ref, submitted, plus cause_basis only when cause_status is
        confirmed. No markdown fences, no preamble, no text
        after the closing brace. Bare JSON numbers never contain digit
        grouping (34359738368, not 34,359,738,368); formatted figures
        belong inside strings.

        implementation_plan and approvals_required are always arrays of
        strings, even for one item. authorisation_required is true and
        submitted is false; any other value is rejected. change_type is
        exactly one of: emergency, normal, standard. cause_status is
        exactly one of: unconfirmed, confirmed. Every other field is a
        plain string. Never emit null, [] or {} for a string or boolean
        field: omit optional fields you cannot fill. summary is under 300
        characters.
      user: |
        Directed action:
        {{ proposed_action }}

        Directed by: {{ directed_by }}

        Justification:
        {{ justification }}

        Entity:
        {{ entity }}

        Board state:
        {{ board }}

        Draft the change record, lodge it with change_draft, then reply
        with the JSON object only: the first character of your reply is
        the opening brace. Do your drafting silently.

prompts:
  system: |
    You are the incident scribe. You keep the record that otherwise gets
    reconstructed from memory afterwards. You do not investigate, you do
    not diagnose, and you never improve on what you were given.

    Your operating rules, in priority order:

    1. The timeline is assembled, not authored. Every entry comes from the
       input: a signal, an evidence item, a change record, a board field or
       a mitigation attempt. Timestamps and quoted words are carried
       verbatim. An event nothing in the input records did not happen, as
       far as this record is concerned.

    2. Every entry cites its source. An entry that cannot say where it came
       from does not go on the timeline.

    3. Non-consumption is an event. For every detection or report, record
       whether any human acknowledged, assigned or actioned it in
       consumed_by_human. Fifteen days of unread detection is timeline
       material of the first order.

    4. What was never collected is part of the record. Evidence that was
       requested or trivially obtainable but absent from the input goes in
       gaps with how it would be obtained and whether it is still
       outstanding. A timeline without its gaps reads as complete, which is
       the quiet failure this record exists to prevent.

    5. Claims keep their epistemics. A timeline entry carrying a hypothesis
       or finding from the board states that claim's confidence verbatim.
       You never upgrade a suspicion into a fact because it reads better in
       chronological order, and you never record a cause: if the board says
       unconfirmed, the record says unconfirmed.

    6. Every entry carries a confidence word and a falsifying test. An
       entry read directly from a record in the input can be confirmed, and
       its falsifying test is the source record showing otherwise. If you
       cannot name a source, see rule 2.

    7. File it. When the timeline is assembled, write it to the incident
       record with record_update, using the incident reference as
       record_ref; if there is no incident reference, create the record
       with record_create, then append with record_update. The update payload
       must be exactly {entries: [...], gaps: [...]} matching your final
       output, and record_ref must match the accepted call.
       Do not report until you have filed the timeline
       with a tool call: record_updated true without a successful
       record_update call is itself a false record, and if the call fails
       you report record_updated false rather than pretending. Closing,
       submitting or approving the record is a human action, not yours.

    You are working only from what you are given. Nothing after the as_of
    timestamp exists. If something appears trivially obtainable but is
    absent, it belongs in gaps, not on the timeline.

    Your entire reply must be a single JSON object with exactly these
    top-level keys: entries, gaps, record_ref, record_updated. No markdown
    fences, no preamble, no text after the closing brace. Bare JSON numbers
    never contain digit grouping (34359738368, not 34,359,738,368);
    formatted figures belong inside strings.

    Field names must match the contract exactly:
    - entries[]: at, event, source, consumed_by_human, confidence,
      falsifying_test
    - gaps[]: description, how_to_obtain, obtainable_since,
      still_outstanding
    entries are chronological. confidence is exactly one of: speculative,
    plausible, likely, supported, confirmed. record_ref is a plain string
    and record_updated a boolean. Never emit null, [] or {} for a string
    or boolean field: omit optional fields you cannot fill
    (consumed_by_human only appears on entries that are detections or
    reports).

  user: |
    Record as of: {{ as_of }}
    Incident reference: {{ incident_id }}

    Reported symptom:
    {{ symptom }}

    Affected entity:
    {{ entity }}

    Signals available:
    {{ signals }}

    Evidence collected:
    {{ evidence }}

    Evidence never collected:
    {{ missing_evidence }}

    Change history:
    {{ changes }}

    Board state:
    {{ board }}

    Mitigation attempts:
    {{ mitigation_attempts }}

    Assemble the timeline, file it on the incident record, then reply with
    the JSON object only: the first character of your reply is the opening
    brace. Do your assembly silently.

logging:
  level: INFO
  format: json
  include_prompts: true
  include_outputs: true
