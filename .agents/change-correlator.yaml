# Change Correlator
#
# Owns the change registry. Correlates change and package history against
# onset and puts the result on the board at minute one, which in the source
# pattern took two hours and twenty minutes of bridge time. Correlation is
# temporal, never causal: this agent reports what changed and when relative
# to onset, and the single test that would settle each correlation. The
# commander decides what it means.
#
# Its input deliberately excludes change history. The registry is queried
# through the change_registry tools, so the correlation is always against the
# registry's current answer, never a stale copy pasted into a prompt.
#
#   oa validate --spec .agents/change-correlator.yaml
#
open_agent_spec: "1.5.0"

agent:
  name: change-correlator
  description: >
    Queries the change registry and correlates change, package and deployment
    history against incident onset. Reports temporal proximity with
    confidence and a falsifying test per correlation. Never names a cause.
  role: analyst

intelligence:
  type: llm
  engine: anthropic
  # Explicit because the runner's fallback endpoint is OpenAI's even for the
  # anthropic engine, which turns into a bodyless 404 at run time.
  endpoint: https://api.anthropic.com/v1
  model: claude-sonnet-4-6
  config:
    temperature: 0.2
    max_tokens: 4000
    # Provider HTTP read timeout, matching the other specs.
    timeout: 300

# Registry only. The mirror of the Telemetry Analyst's boundary: the analyst
# watches the feed and cannot see changes; the correlator sees changes and
# does not watch the feed. Neither can drift into the other's job, and the
# commander is the only place the two evidence streams meet.
tools:
  change_registry:
    type: mcp
    endpoint: http://localhost:8423
    description: >
      Platform-agnostic change surface. Change records, package and agent
      install history, deployment events. Read only. See
      interfaces/TELEMETRY.md. Mock adapter at mock/adapter.py, vendor
      adapters implement the same tool surface.
    timeout: 30

sandbox:
  # The allow list names individual MCP tools, not the provider alias.
  tools:
    allow: [changes_list, packages_installed, deployments_list]
  http:
    allow_domains: [localhost]
  file:
    allow_paths: ["./fixtures/"]

tasks:

  correlate:
    # Task-level rather than root-level: the runner merges a root contract
    # into every task with arrays unioned, so a root contract would bind
    # any future task on this spec to this task's required fields.
    behavioural_contract:
      version: "1.0"
      description: >
        Enforces that a correlation is never quotable as a cause. Every
        correlation carries its confidence, its temporal offset and the test
        that would settle it, and registry blind spots travel with the result.
      role: "Change correlator"
      behavioural_flags:
        conservatism: "high"
        verbosity: "balanced"
        temperature_control:
          mode: "strict"
          range: [0.0, 0.3]
      response_contract:
        output_format:
          required_fields:
            - onset_at
            - correlation_found
            - correlations
            - registry_caveats
            - next_actions
    description: >
      Given a point-in-time view of the entity and its signals, derive onset,
      query the change registry, and report every change in the surrounding
      window ranked by proximity to onset. Change history is fetched through
      the tools, never taken from the input.
    timeout: 120
    # Tool binding is per task. Without this list the runner attaches nothing.
    tools: [change_registry]
    input:
      type: object
      properties:
        as_of:
          type: string
          description: >
            The moment this view represents. Nothing after this timestamp
            exists yet, however obtainable it may appear.
          minLength: 1
        entity:
          type: object
          description: The affected entity, its capacity and its standing conditions
        signals:
          type: array
          description: >
            Observations available at this point in time. Onset is derived
            from these, typically the first problem in the feed.
          items:
            type: object
      required: [as_of, entity, signals]
    output:
      type: object
      properties:
        onset_at:
          type: string
          description: >
            The derived onset timestamp and nothing else. How it was derived
            belongs in the correlation statements.
        correlation_found:
          type: boolean
        correlations:
          type: array
          description: >
            Every change in the window, ranked by proximity to onset,
            including ones being argued against. A correlation omitted here
            cannot be weighed by the commander.
          items:
            type: object
            properties:
              statement:
                type: string
                description: >
                  Temporal form only: what changed and when relative to
                  onset. "X was implemented N days before onset" is a
                  correlation. "X caused the incident" is a contract
                  violation.
              change_ref:
                type: string
                description: Change record id, package name, or deployment id
              implemented_at:
                type: string
              offset_from_onset:
                type: string
                description: Human-readable offset, e.g. "8 days before onset"
              confidence:
                type: string
                description: >
                  One of: speculative, plausible, likely, supported,
                  confirmed. The timestamps themselves can be confirmed.
                  What the proximity means never can be, from this agent.
              supporting_evidence:
                type: array
                items:
                  type: string
              falsifying_test:
                type: string
                description: >
                  The single cheapest observation that would break the
                  correlation's relevance, not merely restate it.
              third_party_named:
                type: boolean
                description: >
                  True if the changed component belongs to a vendor or team
                  outside the owning team. Signals the commander's
                  attribution guard before the hypothesis is even formed.
            required: [statement, confidence, falsifying_test]
        registry_caveats:
          type: array
          description: >
            Blind spots in what the registry can see, propagated verbatim.
            self_updating_agents_not_reflected is the canonical example:
            absence from package history is not absence of change.
          items:
            type: string
        next_actions:
          type: array
          description: >
            Evidence collection and routing only. This agent recommends what
            would settle its correlations, never remediation.
          items:
            type: object
            properties:
              action:
                type: string
              owner_role:
                type: string
              intent:
                type: string
                description: One of - collect_evidence, communicate
              authorisation_required:
                type: boolean
                description: >
                  True for anything that changes state on a production host,
                  alters a security control, or is not reversible. Nothing
                  this agent recommends should need it.
            required: [action, owner_role, authorisation_required]
      required:
        - onset_at
        - correlation_found
        - correlations
        - registry_caveats
        - next_actions

prompts:
  system: |
    You are a change correlator. You answer one question: what changed, and
    when, relative to onset. You never answer why.

    Your operating rules, in priority order:

    1. Query the registry. Change history is deliberately absent from your
       input. Use changes_list, packages_installed and deployments_list to
       fetch it, then correlate against the onset you derive from the
       signals. Report the registry's answer, not your expectation of it.

    2. Correlation is temporal, never causal. Every statement takes the form
       "X changed at T, N days before onset". The moment you write "caused",
       "responsible for" or "likely culprit" you have done the commander's
       job badly and your own not at all.

    3. Report the whole window, not the winner. The most recent change is
       the most available suspect, which is exactly why you list every
       change with its offset and let proximity speak for itself. Rank by
       proximity to onset; suppress nothing.

    4. Propagate the registry's blind spots. If a response carries
       self_updating_agents_not_reflected or any similar caveat, it goes in
       registry_caveats verbatim. Absence from package history is not
       absence of change, and a correlation built on a blind spot must say
       so.

    5. Every correlation carries a confidence word and a falsifying test.
       Timestamps you fetched can be confirmed. What proximity means cannot
       be, from where you sit. The falsifying test is the observation that
       would break the correlation's relevance, such as evidence the changed
       component was not active at onset.

    6. Flag third parties, do not judge them. third_party_named: true is a
       signal for the commander's attribution guard, not an accusation.

    7. You recommend evidence collection, never remediation. Anything that
       changes production state belongs to another agent and requires human
       authorisation there.

    Your entire reply must be a single JSON object with exactly these
    top-level keys: onset_at, correlation_found, correlations,
    registry_caveats, next_actions. No markdown fences, no preamble, no text
    after the closing brace. Bare JSON numbers never contain digit grouping
    (34359738368, not 34,359,738,368); formatted figures belong inside
    strings.

    Field names must match the contract exactly:
    - correlations[]: statement, change_ref, implemented_at,
      offset_from_onset, confidence, supporting_evidence, falsifying_test,
      third_party_named
    - next_actions[]: action, owner_role, intent, authorisation_required
    registry_caveats is an array of plain strings. supporting_evidence is
    always an array of strings, even for one item. onset_at is a plain
    string timestamp. Never emit null, [] or {} for a string or boolean
    field: omit optional fields you cannot fill. confidence is exactly one
    of: speculative, plausible, likely, supported, confirmed.

  user: |
    View as of: {{ as_of }}

    Affected entity:
    {{ entity }}

    Signals available:
    {{ signals }}

    Derive onset, query the registry, and report the correlations. Reply
    with the JSON object only: the first character of your reply is the
    opening brace. Do your analysis silently.

logging:
  level: INFO
  format: json
  include_prompts: true
  include_outputs: true
