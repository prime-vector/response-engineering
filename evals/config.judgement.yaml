# The judgement-mode arms.
#
#   python3 evals/judgement.py --config evals/config.judgement.yaml --list-arms
#   python3 evals/judgement.py --config evals/config.judgement.yaml --arm judgement-heading
#
# One live `oa run` per case per arm, so an arm is a real amount of money and
# a real amount of time. Each one changes exactly one thing against the first,
# which is what makes the difference readable as an experiment rather than as
# two runs that happen to disagree.
#
# The adapter port is not configurable here. `oa` dials whatever the spec's
# tool binding declares, so judgement.py reads the port out of the spec: a
# port set in this file could only ever start an adapter the agent cannot
# reach.

spec: .agents/precedent-analyst.yaml
task: recall

# Wall clock per case. The spec's own task timeout is 300s and recall is a
# multi-round task; this is the outer bound on a run that hangs rather than a
# budget anybody should be near.
timeout: 600

judge:
  # Through the Cursor CLI, which puts judging on a subscription rather than
  # metered per claim. Judging was the recurring cost here: a review finding
  # that changes what the judge is asked owes a re-judge of every arm, and
  # four of those rounds happened while this was built.
  #
  # A different family from the model under test, which is the better reason.
  # Opus judging Sonnet is one house scoring its own work; a Grok judge is not.
  #
  # What this transport cannot do is set sampling. The CLI takes a model and
  # an effort, not a temperature, so nothing here claims temperature 0 any
  # more. That claim was worth less than it read: four judgings at temperature
  # 0 through the metered API moved two to four claims per arm.
  #
  # transport: anthropic is still supported and still pins temperature and a
  # token limit. --check-records refuses to compare records across the two.
  transport: cursor
  model: cursor-grok-4.6-high
  timeout: 300
  # Judgements are independent by construction, so they run concurrently.
  # Sequentially an arm took the better part of an hour through this
  # transport, where roughly half of each call is process spawn and harness
  # preamble rather than the model. Six lanes is deliberately modest: the
  # point is to stop waiting on spawn overhead, not to find a rate limit.
  concurrency: 6
  # The one sampling control this transport has. Set explicitly so it is an
  # input the record names rather than a default that moves verdicts quietly.
  effort: high
  groundedness_prompt: evals/judges/groundedness-judge.txt
  divergence_prompt: evals/judges/divergence-judge.txt

# The records the Phase 5 comparison grid is generated from, in the order the
# columns appear. Named explicitly rather than globbed: "the newest record per
# arm" is a rule that quietly re-points a published table when someone records
# an exploratory sweep.
comparison:
  - evals/results/judgement-heading-20260820T041555Z.json
  - evals/results/judgement-fixed-20260820T044153Z.json
  - evals/results/judgement-single-query-20260820T050303Z.json

arms:
  # The shipped configuration: the index the mock serves by default and the
  # spec's own system prompt. Every other arm is this one with a single
  # change, so this is the one that gets recorded first.
  - label: judgement-heading
    description: >-
      the shipped configuration, heading-aware index and the spec's prompt
    index: corpus/index.json
    chunker: heading

  # Experiment one, the chunker. The retrieval half is measured in
  # chunker-comparison.md, where the two indexes are identical at k = 1, 3, 5
  # and 8 and differ at k = 2 and at the passage budget. Whether that reaches
  # the agent's answers is a different question and this is what answers it.
  - label: judgement-fixed
    description: >-
      the Phase 4 baseline index, fixed-size chunks, spec prompt unchanged
    index: corpus/index.fixed.json
    chunker: fixed

  # Experiment two, the retrieval guidance. docs/precedent-analyst.md named
  # "hybrid with versus without the reranker" here, and there is no reranker
  # in this repo to switch off: the mock ranks by term overlap and the runner
  # refuses a config that declares one. The live finding behind the spec's
  # rule 4 is the experiment that was actually available, and it is a bigger
  # one: at the bridge bound the reported symptom used whole scores 79 of 82
  # passages above zero and clears the floor 0 times, while the signature
  # type alone scores 54 and clears 35.
  #
  # The prompt is derived from the spec's, replacing that one paragraph, and
  # --check-prompts fails when the spec moves under it. An override replaces
  # the whole system prompt rather than editing it, so an arm maintained by
  # hand would drift into being a second prompt rather than one changed rule.
  - label: judgement-single-query
    description: >-
      the shipped prompt with rule 4 replaced. That paragraph carries two
      instructions, search more than once and ask for breadth, and the
      replacement drops both, so the arm measures the paragraph and not query
      count inside it
    index: corpus/index.json
    chunker: heading
    system_prompt: evals/prompts/single-query.system.txt
    derive: single_query
