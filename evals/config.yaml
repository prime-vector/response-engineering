# The Phase 4 baseline configuration.
#
#   python3 evals/runner.py --config evals/config.yaml
#
# Fixed-size chunking and no reranker, which is what docs/precedent-analyst.md
# section 8 fixes the baseline as. Phase 5 compares heading-aware against it,
# so this file is the thing that must not drift: change it and every earlier
# results file is measuring a different configuration under the same name.
#
# chunker is stated here and cross-checked against the index rather than read
# from it. An index path and a chunker name that disagree is exactly how a
# baseline gets recorded against the wrong index, and the comparison it exists
# for then measures nothing.

index: corpus/index.fixed.json
chunker: fixed
reranker: none

# The bounds the rates are read at. 5 is the one Phase 5's --compare reports.
k: [1, 3, 5, 8]

# The fixed passage budget every figure here is measured under. An eval
# parameter, not the agent's: the surface defaults to 5, the spec tells the
# agent to ask for breadth without naming a number, and no demo passes one.
# Stated here rather than inherited from the runner's default, because a
# baseline a code default can move is not fixed by its config whatever the
# config is called.
run_limit: 8

label: baseline-fixed
port: 8528
