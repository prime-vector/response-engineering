# Precedent Analyst evaluation dataset.
#
# Hand-authored, and deliberately not generated. Everything else derived from
# the corpus in this repo is a build artefact with a --check that fails on
# drift, so the instinct here is to generate this too. Do not. Ground truth is
# a judgement about which prior records a competent responder would want to
# see, and a dataset generated from the retriever's own output measures only
# that the retriever agrees with itself. The cases are checkable instead:
# evals/validate.py asserts every retrieval claim below against both indexes,
# so a case that stops being true fails rather than rots.
#
# Synthetic throughout. The incidents described here are invented, the corpus
# they are scored against is generated by fixtures/generate.py, and nothing in
# either is derived from any engagement. Third parties appear only as generic
# categories, never in a causal role.
#
#   python3 evals/validate.py                                  # both indexes
#   python3 evals/validate.py --index corpus/index.fixed.json  # the baseline
#
# ---------------------------------------------------------------------------
# Why ground truth names documents and not passages
#
# docs/precedent-analyst.md sketched this dataset with `expected_passages:
# [<passage_id>, ...]`. That cannot work, and the reason is worth stating
# because the sketch reads as obviously right. corpus/ingest.py derives a
# passage_id from `chunker|source_uri|heading_path|ordinal`, so the chunker
# name is inside the key and the two indexes share no id at all: 82 passages
# under heading, 39 under fixed, disjoint id spaces.
#
# Phase 4 records its baseline against the fixed chunker and Phase 5 compares
# heading-aware against it. Passage-level ground truth would therefore score 0
# on whichever index it was not written against, and the entire Phase 5
# "improvement" would be the id scheme changing rather than retrieval getting
# better. Ground truth is `source_uri`, which both chunkers agree on, and
# precedent_hit_rate@k is measured over documents.
#
# This costs real resolution, and the cost is larger than it first looks. It is
# not only that document-level truth cannot tell a citation of the right
# document's Resolution section from its Gaps section. Nothing else measures it
# either:
#
#   - Adapter-log groundedness proves only that a cited passage_id was in the
#     set the surface returned. A precedent citing Gaps passes that check
#     whenever Gaps was among the hits, which the 2-passages-per-document cap
#     makes common.
#   - The `groundedness` in the metrics table is a different check again, an
#     LLM judge at temperature 0, and neither it nor the log check is written.
#
# So the section-level gap is unmeasured, not mitigated. It belongs in the
# results table as such. Do not let a later edit quietly promote either check
# into a claim that it is covered.
#
# If section quality has to be measured before Phase 5, the way in is an
# optional heading-level expectation scored against the heading-aware index
# only, and never folded into the cross-chunker hit_rate comparison, which is
# the one number the fixed baseline has to be able to share.
#
# ---------------------------------------------------------------------------
# Fields
#
#   id            stable, referenced from results; never renumber
#   group         reporting bucket only
#   intent        what this case is testing, one line
#   as_of         the view's bound, passed to every archive call
#   symptom       what was reported, in the words it was reported in
#   signature     full signature including the entity id, as the signals carry
#                 it. The agent is required to strip the id before querying;
#                 handing it a pre-stripped type would test nothing.
#   evidence      what has been collected, and what each item does not settle
#   missing_evidence  what is outstanding. Usually the sharpest divergence.
#   query         the canonical retrieval probe. Used by retrieval-only mode,
#                 which scores the surface with no model in the loop. The agent
#                 chooses its own queries and is scored on those instead.
#
#   expect.precedent_exists   false means no_applicable_precedent is the
#                             correct and complete answer
#   expect.relevant           documents a responder would want. Judged, not
#                             retrieved. Empty when precedent_exists is false.
#
#     Relevance is a property of the incident as the case states it, meaning
#     (as_of, symptom, evidence, missing_evidence). It is NOT scoped to what
#     the case happens to be testing, and NOT to what the canonical query can
#     reach. Two cases describing the same incident, at the same bound, with
#     the same evidence, must name the same documents: a01, a03, a04 and d02
#     are four probes of one incident and carry one relevance set between them.
#
#     Scoping it to the case is the subtle way this dataset would grade itself.
#     A (case, document) pair left out because the probe cannot reach it is not
#     counted as a miss, and the published recall figure rises without
#     retrieval improving.
#
#     The counter-pressure is that relevance must stay sharp enough to
#     discriminate. A document is relevant when it would change what the
#     responder does or believes: the shape matches, or it warns against the
#     obvious wrong move. Sharing a signature type is not sufficient. If every
#     memory case listed every memory document, hit_rate would measure nothing.
#
#   relevance_group   optional. Cases sharing one are the same incident seen
#                     the same way, and validate.py asserts their `relevant`
#                     and `applicability` are identical. The rule above is
#                     otherwise a thing a later edit has to remember, and the
#                     first version of this dataset is what that looks like
#                     when it is forgotten.
#
#   expect.covering_procedure_waived   why a runbook that covers this case's
#                     signature type, and is in reach at its bound, is
#                     nonetheless not relevant. Required whenever one is
#                     omitted, because omitting it silently is how the same
#                     defect reached four groups in a row: the rule was applied
#                     where someone was looking and not where they were not.
#
#   expect.must_not_cite_reason   why a FILED document cannot ground a claim,
#                             per uri. Drafts need none: record_status already
#                             says it. Anything else has to argue it here.
#   expect.applicability      truth per document. A document offered as
#                             `applies` where this says partial or superseded
#                             is a false precedent, which is the headline
#                             metric.
#   expect.must_not_cite      documents that may legitimately be retrieved but
#                             cannot ground a precedent claim: drafts, and
#                             records describing this incident itself.
#   expect.divergence_names   the actual distinguishing factor. divergence
#                             text is scored on naming this, not on length.
#   expect.queries_must_not_contain   substrings that must not appear in any
#                             issued query. Identity is not a similarity
#                             feature and the archive holds records about the
#                             live host.
#   expect.floor_cleared      asserted by validate.py against the live surface
#                             where the case turns on it. Recorded per index,
#                             because the two chunkers cross the floor
#                             differently and the difference is the point.

dataset_version: 1
corpus_sha_note: >
  Written against the 17-document corpus, date range 2025-08-19 to 2026-03-10.
  validate.py fails if a case names a source_uri the corpus no longer holds.

cases:

  # -------------------------------------------------------------------------
  # A. The composite scenario itself, at both bounds it is run at.
  # -------------------------------------------------------------------------

  - id: a01
    relevance_group: composite-bridge-denial-axis
    group: composite
    intent: >
      The bridge view. The archive holds a near miss on the same signature
      whose resolution would be actively wrong here, a superseded resolution,
      and a working note dated inside this incident's own window.
    as_of: "2026-03-17T19:30:00+00:00"
    symptom: >
      Scheduled batch file transfers completing late. Business user reports
      the integration console is slow to respond. No transfers have failed.
    signature: host.memory.exhaustion:intg-prod-a1
    evidence:
      - Process listing confirms the audit analysis daemon is active and
        consuming CPU. Does not identify what is generating the denials.
      - Security module confirmed in enforcing mode. Denials are real and are
        being logged.
    missing_evidence:
      - Audit denial log for the affected window, showing the source domain
        and denied action for each denial. Requested twice, not produced.
      - Process-level memory attribution taken while the host is exhausted.
    query: host.memory.exhaustion
    expect:
      precedent_exists: true
      relevant:
        - corpus://incidents/INC-2411
        - corpus://incidents/INC-2419
        - corpus://incidents/INC-2288
        - corpus://runbooks/memory-pressure
        - corpus://runbooks/denial-log-collection
      applicability:
        corpus://incidents/INC-2411: partial
        corpus://incidents/INC-2419: partial
        corpus://incidents/INC-2288: superseded
        corpus://runbooks/memory-pressure: applies
        corpus://runbooks/denial-log-collection: applies
      must_not_cite:
        - corpus://incidents/DRAFT-2601
      divergence_names:
        - no heap or tuning change on this host
        - process-level attribution never captured
        - the denial log that would name the source domain is outstanding
      queries_must_not_contain: ["intg-prod-a1"]

  - id: a02
    relevance_group: composite-d1
    group: composite
    intent: >
      Act one, the D+1 view. The working note does not exist yet at this
      bound, so the trap is out of reach rather than retrieved and rejected.
      A precedent citing it here means the bound was not passed.
    as_of: "2026-03-03T09:00:00+00:00"
    symptom: >
      Memory exhaustion problem opened and auto-closed on the integration
      host for the second consecutive day. Nobody has acknowledged either.
    signature: host.memory.exhaustion:intg-prod-a1
    evidence:
      - >-
        Standing condition, 23 of 32 GiB resident to the existing largest
        consumer. Says nothing about what has changed.
    missing_evidence:
      - Process-level memory attribution taken while the host is exhausted.
    query: host.memory.exhaustion
    expect:
      precedent_exists: true
      relevant:
        - corpus://incidents/INC-2411
        - corpus://incidents/INC-2419
        - corpus://runbooks/memory-pressure
      applicability:
        corpus://incidents/INC-2411: partial
        corpus://incidents/INC-2419: partial
        corpus://runbooks/memory-pressure: applies
      must_not_cite:
        - corpus://incidents/DRAFT-2601
      unreachable_by_bound:
        - corpus://incidents/DRAFT-2601
      divergence_names:
        - no change correlated to onset yet at this bound
      queries_must_not_contain: ["intg-prod-a1"]

  - id: a03
    relevance_group: composite-bridge-denial-axis
    group: composite
    intent: >
      The second axis of the same incident. The evidence names a denial
      daemon, which the signature does not, and it is the axis that reaches
      the superseded record. A single query never finds this.
    as_of: "2026-03-17T19:30:00+00:00"
    symptom: >
      Scheduled batch file transfers completing late. Business user reports
      the integration console is slow to respond. No transfers have failed.
    signature: host.memory.exhaustion:intg-prod-a1
    evidence:
      - Process listing confirms the audit analysis daemon is active and
        consuming CPU. Does not identify what is generating the denials.
    missing_evidence:
      - Audit denial log for the affected window, showing the source domain.
    query: denial analysis daemon resident audit dispatcher
    expect:
      precedent_exists: true
      relevant:
        - corpus://incidents/INC-2411
        - corpus://incidents/INC-2419
        - corpus://incidents/INC-2288
        - corpus://runbooks/memory-pressure
        - corpus://runbooks/denial-log-collection
      applicability:
        corpus://incidents/INC-2411: partial
        corpus://incidents/INC-2419: partial
        corpus://incidents/INC-2288: superseded
        corpus://runbooks/memory-pressure: applies
        corpus://runbooks/denial-log-collection: applies
      must_not_cite:
        - corpus://incidents/DRAFT-2601
      divergence_names:
        - deactivating the dispatcher is no longer available under SEC-STD-14
        - doing it destroys the denial log that is the outstanding evidence
      queries_must_not_contain: ["intg-prod-a1"]

  - id: a04
    relevance_group: composite-bridge-denial-axis
    group: composite
    intent: >
      Query dilution, measured as a case rather than described. The reported
      symptom used whole scores 79 of 82 passages above zero and clears the
      floor 0 times, so an agent that issues one verbose query retrieves
      nothing and refuses. The archive holds precedent, so that refusal is a
      false refusal and this case is what makes false_refusal_rate mean
      something.
    as_of: "2026-03-17T19:30:00+00:00"
    symptom: >
      Scheduled batch file transfers completing late. Business user reports
      the integration console is slow to respond. No transfers have failed.
    signature: host.memory.exhaustion:intg-prod-a1
    evidence:
      - Process listing confirms the audit analysis daemon is active and
        consuming CPU.
    missing_evidence:
      - Audit denial log for the affected window.
    query: >
      Scheduled batch file transfers completing late. Business user reports
      the integration console is slow to respond. No transfers have failed.
    expect:
      precedent_exists: true
      relevant:
        - corpus://incidents/INC-2411
        - corpus://incidents/INC-2419
        - corpus://incidents/INC-2288
        - corpus://runbooks/memory-pressure
        - corpus://runbooks/denial-log-collection
      applicability:
        corpus://incidents/INC-2411: partial
        corpus://incidents/INC-2419: partial
        corpus://incidents/INC-2288: superseded
        corpus://runbooks/memory-pressure: applies
        corpus://runbooks/denial-log-collection: applies
      must_not_cite:
        - corpus://incidents/DRAFT-2601
      queries_must_not_contain: ["intg-prod-a1"]
      floor_cleared:
        heading: 0
        fixed: 0
      note: >
        floor_cleared 0 is a property of the canonical query, not of the case.
        The agent is expected to recover by querying distinctive terms and
        querying more than once; a refusal here scores as a false refusal.

  # -------------------------------------------------------------------------
  # B. Near misses. A precedent that matches on symptom and diverges on the
  #    thing that decides what to do. Offering any of these as `applies` is
  #    the anchoring failure this agent exists to prevent.
  # -------------------------------------------------------------------------

  - id: b01
    group: near_miss
    intent: >
      Same signature type, and the prior incident was settled by reverting a
      change. There is no such change here, so the resolution does not
      transfer and the record is partial at best.
    as_of: "2026-03-17T19:30:00+00:00"
    symptom: >
      Host swapping heavily. Batch work running late. Change history for the
      host was queried and returned nothing in the fortnight before onset.
    signature: host.memory.exhaustion:intg-prod-b7
    evidence:
      - Change and package history queried across a 14 day window before
        onset. Empty. Recorded as a finding, not as absence of change.
    missing_evidence:
      - Process-level memory attribution taken while the host is exhausted.
    query: heap resize tuning change swap
    expect:
      precedent_exists: true
      relevant:
        - corpus://incidents/INC-2411
        - corpus://runbooks/memory-pressure
      applicability:
        corpus://incidents/INC-2411: partial
        corpus://runbooks/memory-pressure: applies
      divergence_names:
        - the prior incident had a heap change to revert and this one has no
          correlated change at all

  - id: b02
    group: near_miss
    intent: >
      The superseded resolution. A later standard withdrew it, and the record
      must be surfaced with the standard named rather than recommended or
      quietly dropped.
    as_of: "2026-03-17T19:30:00+00:00"
    symptom: >
      A denial-analysis process has held roughly a fifth of CPU for four days
      and spikes to full utilisation during scans.
    signature: host.cpu.saturation:mid-prod-r8
    evidence:
      - Process snapshot names the denial-analysis daemon as top CPU consumer.
    missing_evidence:
      - Denial log naming the source domain of the denials.
    query: denial analysis daemon resident audit dispatcher
    expect:
      precedent_exists: true
      relevant:
        - corpus://incidents/INC-2288
        - corpus://runbooks/denial-log-collection
      applicability:
        corpus://incidents/INC-2288: superseded
        corpus://runbooks/denial-log-collection: applies
      divergence_names:
        - SEC-STD-14
        - the dispatcher must remain active on production hosts
        - deactivating it destroyed the evidence that would name the source

  - id: b03
    group: near_miss
    intent: >
      The mis-reported record. Its own Gaps section says a search for memory
      exhaustion still returns it, because the resource named in the original
      report was never corrected. Offering it as applying to a host that is
      genuinely out of memory is the cost of that, and it is exactly the
      failure the record warns about.
    as_of: "2026-03-17T19:30:00+00:00"
    symptom: >
      Host reported as exhausted. Swap in use and climbing, page fault rate
      elevated, filesystem utilisation confirmed normal.
    signature: host.memory.exhaustion:rep-prod-q4
    evidence:
      - Filesystem utilisation checked and normal on every mount.
      - Swap in use, 6 GiB and climbing over four hours.
    missing_evidence:
      - Process-level memory attribution.
    query: host exhausted memory swap page fault filesystem
    expect:
      precedent_exists: true
      relevant:
        - corpus://incidents/INC-2446
        - corpus://runbooks/memory-pressure
      applicability:
        corpus://incidents/INC-2446: partial
        corpus://runbooks/memory-pressure: applies
      divergence_names:
        - the prior record's exhausted resource was disk and never memory
        - filesystem utilisation is confirmed normal here

  - id: b04
    group: near_miss
    intent: >
      Container limit against host exhaustion. Similar words in a ticket,
      almost nothing else in common, and the runbook exists to say so. A host
      with no ceiling gives none of what the limit case gives.
    as_of: "2026-03-17T19:30:00+00:00"
    symptom: >
      Workload on the host is failing to allocate. The host runs the workload
      directly with no container runtime.
    signature: host.memory.exhaustion:etl-prod-w2
    evidence:
      - No container runtime present on the host. There is no memory limit to
        read.
    missing_evidence:
      - Resident set of the largest existing consumer, to establish the
        standing condition.
    query: container memory limit restarted orchestrator
    expect:
      precedent_exists: true
      relevant:
        - corpus://incidents/INC-2305
        - corpus://runbooks/container-resource-limits
        - corpus://runbooks/memory-pressure
      applicability:
        corpus://incidents/INC-2305: partial
        corpus://runbooks/container-resource-limits: partial
        corpus://runbooks/memory-pressure: applies
      divergence_names:
        - the prior incident's host never entered exhaustion and stayed flat
        - there is no container limit on this host to raise or bound
      note: >
        The runbook is partial rather than applies because its own closing
        section excludes this shape: hosts running a workload directly are
        sent to the host memory exhaustion runbook instead.

  - id: b05
    group: near_miss
    intent: >
      Swap in use by design against swap in use because memory ran out. The
      prior record's answer was to correct the alert threshold and change
      nothing on the host, which here would close a live incident by
      silencing it.
    as_of: "2026-03-17T19:30:00+00:00"
    symptom: >
      Swap in use and an elevated page fault rate on a host that has never
      swapped before.
    signature: host.memory.pressure:api-prod-s6
    evidence:
      - Host has not used swap at any point in the preceding year.
      - Host is not configured to overcommit.
    missing_evidence:
      - Process-level memory attribution.
    query: swap overcommitted cache host page fault baseline
    expect:
      precedent_exists: true
      relevant:
        - corpus://incidents/INC-2489
        - corpus://runbooks/memory-pressure
      applicability:
        corpus://incidents/INC-2489: partial
        corpus://runbooks/memory-pressure: applies
      divergence_names:
        - the prior host was deliberately overcommitted and had run that way
          since it was built
        - this host has never swapped before and is not overcommitted

  - id: b06
    group: near_miss
    intent: >
      The prior incident was resolved by restarting the workload, with the
      cause never established. The memory-pressure runbook names that as how
      an incident gets closed with the cause unconfirmed. Repeating it here
      destroys the attribution that is the outstanding evidence.
    as_of: "2026-03-17T19:30:00+00:00"
    symptom: >
      Memory exhaustion recurring daily on the same host, auto-closed each
      time, unacknowledged throughout.
    signature: host.memory.exhaustion:intg-prod-j9
    evidence:
      - Problem has opened and auto-closed on eight of the last eleven days.
    missing_evidence:
      - Process-level memory attribution taken while the host is exhausted.
        Requested and outstanding.
    query: recurring memory exhaustion workload restarted cause unconfirmed
    expect:
      precedent_exists: true
      relevant:
        - corpus://incidents/INC-2419
        - corpus://runbooks/memory-pressure
      applicability:
        corpus://incidents/INC-2419: partial
        corpus://runbooks/memory-pressure: applies
      divergence_names:
        - the prior incident's restart resolved the symptom and destroyed the
          evidence, leaving the cause unconfirmed
        - the attribution is still obtainable here and is outstanding

  - id: b07
    group: near_miss
    intent: >
      Sustained CPU that was expected and recorded in advance, against
      sustained CPU with no change behind it. The prior answer was capacity,
      which here would add hardware to an unexplained condition.
    as_of: "2026-03-17T19:30:00+00:00"
    symptom: >
      CPU near full utilisation for three days. No planned change on the
      host and no capacity plan recorded.
    signature: host.cpu.saturation:api-prod-t1
    evidence:
      - Change registry queried across the fortnight before onset. Empty.
    missing_evidence:
      - Process snapshot naming what is consuming the CPU.
    query: sustained CPU saturation scheduled migration capacity sizing
    expect:
      precedent_exists: true
      relevant:
        - corpus://incidents/INC-2407
      applicability:
        corpus://incidents/INC-2407: partial
      divergence_names:
        - the prior saturation was a planned load increase recorded in advance
        - no change correlates to onset here, so it is not a sizing question

  # -------------------------------------------------------------------------
  # C. Precedent that genuinely applies. Without these the agent could score
  #    perfectly by refusing everything.
  # -------------------------------------------------------------------------

  - id: c01
    group: applies
    intent: >
      An existing process whose behaviour changed after its destination went
      away, with change history empty. The prior record is the same shape.
    as_of: "2026-03-17T19:30:00+00:00"
    symptom: >
      Memory exhaustion building over several days on a host with no recent
      change. A log forwarding destination has been unreachable since onset.
    signature: host.memory.exhaustion:etl-prod-c8
    evidence:
      - Log forwarding destination unreachable since the day onset began.
      - Change history queried and empty, recorded as a finding.
    missing_evidence:
      - Resident set attribution by process.
    query: log shipper buffering memory destination unreachable
    expect:
      precedent_exists: true
      relevant:
        - corpus://incidents/INC-2350
        - corpus://runbooks/memory-pressure
      applicability:
        corpus://incidents/INC-2350: applies
        corpus://runbooks/memory-pressure: applies
      divergence_names:
        - the buffering process here has not been identified yet

  - id: c02
    group: applies
    intent: >
      A container restarting on its own limit, with the host flat throughout.
      The prior record and the runbook both fit without qualification.
    as_of: "2026-03-17T19:30:00+00:00"
    symptom: >
      A service container has been restarted nine times since midnight. Host
      memory and swap flat throughout.
    signature: container.memory.limit:svc-prod-k9
    evidence:
      - Host memory and swap flat across the whole window.
      - Container terminated on reaching its configured memory limit.
    missing_evidence:
      - What in the process grew without a bound.
    query: container memory limit restarted orchestrator
    expect:
      precedent_exists: true
      relevant:
        - corpus://incidents/INC-2305
        - corpus://runbooks/container-resource-limits
      applicability:
        corpus://incidents/INC-2305: applies
        corpus://runbooks/container-resource-limits: applies
      divergence_names:
        - what grew has not been identified here

  - id: c03
    group: applies
    intent: >
      Saturation following a recorded migration, with no anomalous process.
      A sizing question, and the prior record says so.
    as_of: "2026-03-17T19:30:00+00:00"
    symptom: >
      CPU near full utilisation since a scheduled migration completed the
      previous night. No process present that was not present last week.
    signature: host.cpu.saturation:api-prod-d9
    evidence:
      - Migration recorded in the change registry, completed the night before
        onset.
      - Process inventory unchanged against the preceding week.
    missing_evidence:
      - Capacity plan for the migrated load.
    query: sustained CPU saturation scheduled migration capacity sizing
    expect:
      precedent_exists: true
      relevant:
        - corpus://incidents/INC-2407
      applicability:
        corpus://incidents/INC-2407: applies
      divergence_names:
        - the capacity plan is not attached to the change record here either

  - id: c04
    group: applies
    intent: >
      The comparison that would settle a hypothesis is unavailable because
      the non-production equivalent differs. A standing risk, not an action.
    as_of: "2026-03-17T19:30:00+00:00"
    symptom: >
      The proposed falsifying test is a comparison against non-production.
      Non-production differs in build and patch level.
    signature: validation.parity:intg-prod-h8
    evidence:
      - Build and patch levels differ between the two environments.
    missing_evidence:
      - A comparable environment to run the falsifying test against.
    query: non-production build parity comparison
    expect:
      precedent_exists: true
      relevant:
        - corpus://incidents/INC-2377
      applicability:
        corpus://incidents/INC-2377: applies
      divergence_names:
        - the parity gap is known in advance here rather than discovered
          mid-incident

  - id: c05
    group: applies
    intent: >
      Convergence on the newest change without direct evidence, which is the
      pattern both the prior record and the runbook describe.
    as_of: "2026-03-17T19:30:00+00:00"
    symptom: >
      The bridge has named the most recently deployed component as probable
      cause. No evidence has been recorded that distinguishes it.
    signature: investigation.attribution:intg-prod-g9
    evidence:
      - Deployment is the most recent change on the host.
    missing_evidence:
      - Any evidence that distinguishes the named component from the
        alternatives.
    query: most recent change named cause without evidence correlation
    expect:
      precedent_exists: true
      relevant:
        - corpus://incidents/INC-2402
        - corpus://runbooks/change-correlation
      applicability:
        corpus://incidents/INC-2402: applies
        corpus://runbooks/change-correlation: applies
      divergence_names:
        - the component here has not yet been shown loaded or not loaded on
          the affected host

  - id: c06
    group: applies
    intent: >
