  # -------------------------------------------------------------------------
  # D. Record status. A draft is unsubmitted and unreviewed, and cannot be the
  #    basis of a precedent claim however well it matches.
  # -------------------------------------------------------------------------

  - id: d01
    group: record_status
    intent: >
      The best-matching record is a draft and cannot ground a claim, but a
      filed runbook covers the failure. So the correct answer is the procedure
      cited and the draft refused, not a refusal: an agent that declines
      outright has over-refused, and one that cites the working note has
      grounded a claim on something unreviewed.
    as_of: "2026-03-17T19:30:00+00:00"
    symptom: >
      Swap climbing overnight since two batch schedules began starting in the
      same hour.
    signature: host.memory.pressure:batch-prod-e9
    evidence:
      - Both batch schedules now start within the same hour.
    missing_evidence:
      - Peak working set of each batch job.
    query: overlapping batch schedules swap thrash nightly
    expect:
      precedent_exists: true
      relevant:
        - corpus://runbooks/memory-pressure
      applicability:
        corpus://runbooks/memory-pressure: applies
      must_not_cite:
        - corpus://incidents/DRAFT-2508
      divergence_names:
        - the peak working set of each batch job has not been measured, so the
          standing condition the procedure asks for is not established
      note: >
        DRAFT-2508 clears the floor on this query and is the right document to
        have found. What it cannot do is ground a claim.

        An earlier version of this case set precedent_exists false, on the
        reasoning that nothing filed touched this shape. That was true of the
        incident records and false of the archive: the memory-pressure runbook
        opens on a host reported as swapping and is in reach at this bound. The
        effect was that an agent correctly citing the procedure scored as a
        false precedent while a refusal scored as correct, which is the dataset
        teaching over-refusal. That is the opposite failure to the one this
        agent is built against and no less wrong.

