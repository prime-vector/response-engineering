<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 306" width="960" height="306" role="img" aria-label="The same precedent query issued with two different time bounds. Bounded at D plus 1 the working note dated inside the incident window is excluded. Bounded at D plus 15 the same query returns it, flagged as a claimed cause rather than evidence.">
  <title>The same precedent query issued with two different time bounds. Bounded at D plus 1 the working note dated inside the incident window is excluded. Bounded at D plus 15 the same query returns it, flagged as a claimed cause rather than evidence.</title>
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;fill:#131A1C}
    .t{font-size:11px}
    .t-b{font-size:11px;font-weight:600}
    .t-s{font-size:9.5px;fill:#6E7D7C}
    .t-e{font-size:9.5px;letter-spacing:.14em;fill:#6E7D7C}
    .t-n{font-size:13px;font-weight:600}
    .t-a{fill:#186B66}
    .t-h{fill:#A9491A}
    .box{fill:#FFFFFF;stroke:#C9D4D3;stroke-width:1.4}
    .box-a{fill:#DDECEA;stroke:#186B66;stroke-width:1.4}
    .box-h{fill:#F6E4D9;stroke:#A9491A;stroke-width:1.4}
    .box-g{fill:none;stroke:#C9D4D3;stroke-width:1.4;stroke-dasharray:4 4}
    .band{fill:#E6ECEB}
    .panel{fill:none;stroke:#C9D4D3;stroke-width:1.4}
    .ln{stroke:#6E7D7C;stroke-width:1.4;fill:none}
    .ln-a{stroke:#186B66;stroke-width:1.6;fill:none}
    .ln-h{stroke:#A9491A;stroke-width:1.6;fill:none}
    .ln-r{stroke:#C9D4D3;stroke-width:1.4;fill:none}
    .dash{stroke-dasharray:4 4}
    .mk{fill:#6E7D7C}
    .mk-a{fill:#186B66}
    .mk-h{fill:#A9491A}
    .faint{opacity:.42}
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mk"/></marker>
    <marker id="ar-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mk-a"/></marker>
    <marker id="ar-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mk-h"/></marker>
  </defs>
  <rect width="960" height="306" fill="#F7F9F9"/>


        <text class="t-e" x="24" y="30">ONE QUERY, TWO BOUNDS</text>

        <rect class="box" x="24" y="112" width="204" height="86" rx="3"/>
        <text class="t-b" x="38" y="136">precedent.search</text>
        <text class="t-s" x="38" y="154">signature_terms:</text>
        <text class="t-s" x="38" y="166">host.memory.exhaustion</text>
        <text class="t-s" x="38" y="184">never the entity id</text>

        <path class="ln" d="M228 140 C 268 140, 268 74, 304 74" marker-end="url(#ar)"/>
        <path class="ln" d="M228 170 C 268 170, 268 240, 304 240" marker-end="url(#ar)"/>

        <line class="ln-a dash" x1="320" y1="34" x2="320" y2="126"/>
        <text class="t t-a" x="330" y="46">before = D+1</text>
        <text class="t-s" x="330" y="60">required. no unbounded value exists.</text>

        <line class="ln-a dash" x1="320" y1="184" x2="320" y2="286"/>
        <text class="t t-a" x="330" y="272">before = D+15</text>

        <rect class="box" x="392" y="46" width="238" height="72" rx="3"/>
        <text class="t-b" x="406" y="70">2 passages, each cited</text>
        <text class="t-s" x="406" y="88">passage_id, source_uri,</text>
        <text class="t-s" x="406" y="100">heading_path, ordinal</text>

        <rect class="box-g" x="654" y="46" width="282" height="72" rx="3"/>
        <text class="t-b" x="668" y="70">DRAFT-2601  withheld</text>
        <text class="t-s" x="668" y="88">excluded_by_before: 1</text>
        <text class="t-s" x="668" y="100">coverage is bounded the same way</text>

        <line class="ln" x1="630" y1="82" x2="650" y2="82" marker-end="url(#ar)"/>

        <rect class="box" x="392" y="196" width="238" height="72" rx="3"/>
        <text class="t-b" x="406" y="220">3 passages, each cited</text>
        <text class="t-s" x="406" y="238">same query, later bound</text>

        <rect class="box-h" x="654" y="196" width="282" height="72" rx="3"/>
        <text class="t-b t-h" x="668" y="220">DRAFT-2601  returned</text>
        <text class="t-s" x="668" y="238">document_cause_claimed: named</text>
        <text class="t-s" x="668" y="252">a signal, never evidence</text>

        <line class="ln-h" x1="630" y1="232" x2="650" y2="232" marker-end="url(#ar-h)"/>

      </svg>
