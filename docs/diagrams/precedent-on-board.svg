<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 286" width="960" height="286" role="img" aria-label="The Precedent Analyst's typed output enters the Incident Commander's board as supporting evidence. A crossed path shows a citation cannot enter the blocking evidence slot as typed data, which still holds the audit denial log that was never produced. Convergence stays disallowed while an item is marked still outstanding, which is a rule about what the board says rather than about what it was handed.">
  <title>The Precedent Analyst's typed output enters the Incident Commander's board as supporting evidence. A crossed path shows a citation cannot enter the blocking evidence slot as typed data, which still holds the audit denial log that was never produced. Convergence stays disallowed while an item is marked still outstanding, which is a rule about what the board says rather than about what it was handed.</title>
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;fill:#131A1C}
    .t{font-size:11px}
    .t-b{font-size:11px;font-weight:600}
    .t-s{font-size:9.5px;fill:#6E7D7C}
    .t-e{font-size:9.5px;letter-spacing:.14em;fill:#6E7D7C}
    .t-n{font-size:13px;font-weight:600}
    .t-a{fill:#186B66}
    .t-h{fill:#A9491A}
    .box{fill:#FFFFFF;stroke:#C9D4D3;stroke-width:1.4}
    .box-a{fill:#DDECEA;stroke:#186B66;stroke-width:1.4}
    .box-h{fill:#F6E4D9;stroke:#A9491A;stroke-width:1.4}
    .box-g{fill:none;stroke:#C9D4D3;stroke-width:1.4;stroke-dasharray:4 4}
    .band{fill:#E6ECEB}
    .panel{fill:none;stroke:#C9D4D3;stroke-width:1.4}
    .ln{stroke:#6E7D7C;stroke-width:1.4;fill:none}
    .ln-a{stroke:#186B66;stroke-width:1.6;fill:none}
    .ln-h{stroke:#A9491A;stroke-width:1.6;fill:none}
    .ln-r{stroke:#C9D4D3;stroke-width:1.4;fill:none}
    .dash{stroke-dasharray:4 4}
    .mk{fill:#6E7D7C}
    .mk-a{fill:#186B66}
    .mk-h{fill:#A9491A}
    .faint{opacity:.42}
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mk"/></marker>
    <marker id="ar-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mk-a"/></marker>
    <marker id="ar-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mk-h"/></marker>
  </defs>
  <rect width="960" height="286" fill="#F7F9F9"/>


        <text class="t-e" x="24" y="30">TYPED PRECEDENT</text>
        <text class="t-e" x="300" y="30">THE HYPOTHESIS BOARD</text>

        <rect class="box-a" x="24" y="58" width="200" height="112" rx="3"/>
        <text class="t-b" x="38" y="82">Precedent Analyst</text>
        <text class="t-s" x="38" y="100">cited by passage_id</text>
        <text class="t-s" x="38" y="114">divergence stated</text>
        <text class="t-s" x="38" y="128">applicability: partial</text>
        <text class="t-s" x="38" y="142">confidence: plausible</text>
        <text class="t-s" x="38" y="156">falsifying_test named</text>

        <rect class="panel" x="300" y="44" width="420" height="196" rx="3"/>

        <rect class="box-a" x="316" y="72" width="388" height="66" rx="3"/>
        <text class="t-b t-a" x="330" y="94">supporting_evidence</text>
        <text class="t-s" x="330" y="112">precedent, cited and bounded</text>
        <text class="t-s" x="330" y="126">alongside the correlation, and no findings</text>

        <rect class="box-h" x="316" y="156" width="388" height="66" rx="3"/>
        <text class="t-b t-h" x="330" y="178">blocking_evidence</text>
        <text class="t-s" x="330" y="196">the audit denial log, source domain</text>
        <text class="t-s" x="330" y="210">requested twice, never produced</text>

        <line class="ln-a" x1="224" y1="102" x2="310" y2="102" marker-end="url(#ar-a)"/>

        <path class="ln-h dash" d="M224 146 C 254 146, 258 182, 306 188" marker-end="url(#ar-h)"/>
        <line class="ln-h" x1="248" y1="158" x2="264" y2="174"/>
        <line class="ln-h" x1="264" y1="158" x2="248" y2="174"/>

        <line class="ln-h" x1="720" y1="189" x2="762" y2="189" marker-end="url(#ar-h)"/>

        <rect class="box-h" x="768" y="156" width="168" height="66" rx="3"/>
        <text class="t-b t-h" x="782" y="178">convergence_allowed</text>
        <text class="t-b t-h" x="782" y="198">false</text>
        <text class="t-s" x="782" y="214">while an item is still_outstanding</text>

        <text class="t-s" x="24" y="268">a precedent can support a hypothesis. no typed route makes it deciding evidence: not the blocking list, not a confirmed one.</text>

      </svg>
