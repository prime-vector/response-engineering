<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 404" width="960" height="404" role="img" aria-label="Three acts. Act one at D plus 1 runs the Telemetry Analyst detect task against the near-empty day one view. Act two at the D plus 15 bridge runs the Change Correlator and the Precedent Analyst, whose correlation and typed precedent both feed the Incident Commander assess task. Act three runs the commander's mitigate task, which is blocked pre-dispatch, and the Scribe, which drafts the change record and files the timeline.">
  <title>Three acts. Act one at D plus 1 runs the Telemetry Analyst detect task against the near-empty day one view. Act two at the D plus 15 bridge runs the Change Correlator and the Precedent Analyst, whose correlation and typed precedent both feed the Incident Commander assess task. Act three runs the commander's mitigate task, which is blocked pre-dispatch, and the Scribe, which drafts the change record and files the timeline.</title>
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;fill:#131A1C}
    .t{font-size:11px}
    .t-b{font-size:11px;font-weight:600}
    .t-s{font-size:9.5px;fill:#6E7D7C}
    .t-e{font-size:9.5px;letter-spacing:.14em;fill:#6E7D7C}
    .t-n{font-size:13px;font-weight:600}
    .t-a{fill:#186B66}
    .t-h{fill:#A9491A}
    .box{fill:#FFFFFF;stroke:#C9D4D3;stroke-width:1.4}
    .box-a{fill:#DDECEA;stroke:#186B66;stroke-width:1.4}
    .box-h{fill:#F6E4D9;stroke:#A9491A;stroke-width:1.4}
    .box-g{fill:none;stroke:#C9D4D3;stroke-width:1.4;stroke-dasharray:4 4}
    .band{fill:#E6ECEB}
    .panel{fill:none;stroke:#C9D4D3;stroke-width:1.4}
    .ln{stroke:#6E7D7C;stroke-width:1.4;fill:none}
    .ln-a{stroke:#186B66;stroke-width:1.6;fill:none}
    .ln-h{stroke:#A9491A;stroke-width:1.6;fill:none}
    .ln-r{stroke:#C9D4D3;stroke-width:1.4;fill:none}
    .dash{stroke-dasharray:4 4}
    .mk{fill:#6E7D7C}
    .mk-a{fill:#186B66}
    .mk-h{fill:#A9491A}
    .faint{opacity:.42}
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mk"/></marker>
    <marker id="ar-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mk-a"/></marker>
    <marker id="ar-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mk-h"/></marker>
  </defs>
  <rect width="960" height="404" fill="#F7F9F9"/>


        <text class="t-e" x="24" y="34">ACT ONE  /  D+1</text>
        <text class="t-e" x="260" y="34">ACT TWO  /  D+15, THE BRIDGE</text>
        <text class="t-e" x="668" y="34">ACT THREE  /  THE DIRECTED CHANGE</text>

        <rect class="panel" x="24" y="52" width="212" height="314" rx="3"/>
        <rect class="panel" x="260" y="52" width="384" height="314" rx="3"/>
        <rect class="panel" x="668" y="52" width="268" height="314" rx="3"/>

        <rect class="box" x="38" y="74" width="184" height="90" rx="3"/>
        <text class="t-b" x="52" y="96">Telemetry Analyst</text>
        <text class="t-s t-a" x="52" y="112">detect</text>
        <text class="t-s t-a" x="52" y="126">telemetry</text>
        <text class="t-s" x="52" y="142">occurrence_count: 13</text>
        <text class="t-s" x="52" y="156">acknowledged_count: 0</text>

        <text class="t-s" x="52" y="200">the D+1 view holds two</text>
        <text class="t-s" x="52" y="214">auto-closed problems and</text>
        <text class="t-s" x="52" y="228">a metric series. nearly</text>
        <text class="t-s" x="52" y="242">empty, by design.</text>

        <text class="t-s" x="52" y="284">the archive answers at</text>
        <text class="t-s" x="52" y="298">this bound too. nobody</text>
        <text class="t-s" x="52" y="312">asked it for fifteen</text>
        <text class="t-s" x="52" y="326">days.</text>

        <rect class="box" x="274" y="74" width="170" height="90" rx="3"/>
        <text class="t-b" x="288" y="96">Change Correlator</text>
        <text class="t-s t-a" x="288" y="112">correlate</text>
        <text class="t-s t-a" x="288" y="126">change_registry</text>
        <text class="t-s" x="288" y="142">D-8 install, 8 days</text>
        <text class="t-s" x="288" y="156">before onset.</text>

        <rect class="box" x="460" y="74" width="170" height="90" rx="3"/>
        <text class="t-b" x="474" y="96">Precedent Analyst</text>
        <text class="t-s t-a" x="474" y="112">recall</text>
        <text class="t-s t-a" x="474" y="126">precedent_archive</text>
        <text class="t-s" x="474" y="142">before = view's as_of</text>
        <text class="t-s" x="474" y="156">refusal is valid</text>

        <line class="ln-a" x1="359" y1="164" x2="359" y2="252" marker-end="url(#ar-a)"/>
        <text class="t-s t-a" x="369" y="212">correlation</text>

        <line class="ln-a" x1="545" y1="164" x2="545" y2="252" marker-end="url(#ar-a)"/>
        <text class="t-s t-a" x="555" y="212">precedent</text>

        <rect class="box-a" x="274" y="258" width="300" height="90" rx="3"/>
        <text class="t-b" x="288" y="280">Incident Commander</text>
        <text class="t-s t-a" x="288" y="296">assess</text>
        <text class="t-s" x="288" y="312">hypotheses carry precedent_cited,</text>
        <text class="t-s" x="288" y="326">blocking_evidence cannot. attribution_guard</text>
        <text class="t-s" x="288" y="340">convergence_allowed: false</text>

        <rect class="box-h" x="682" y="74" width="240" height="76" rx="3"/>
        <text class="t-b t-h" x="696" y="96">Incident Commander</text>
        <text class="t-s t-h" x="696" y="112">mitigate  ·  host, bound</text>
        <text class="t-s" x="696" y="126">SANDBOX_TOOL_VIOLATION</text>
        <text class="t-s" x="696" y="140">implemented: false</text>

        <line class="ln-h" x1="802" y1="150" x2="802" y2="162" marker-end="url(#ar-h)"/>

        <rect class="box" x="682" y="166" width="240" height="76" rx="3"/>
        <text class="t-b" x="696" y="188">Scribe</text>
        <text class="t-s t-a" x="696" y="204">draft_change_record  ·  sink</text>
        <text class="t-s" x="696" y="218">the blocked change is still</text>
        <text class="t-s" x="696" y="232">documented. submitted: false</text>

        <rect class="box" x="682" y="258" width="240" height="90" rx="3"/>
        <text class="t-b" x="696" y="280">Scribe</text>
        <text class="t-s t-a" x="696" y="296">timeline  ·  incident_record</text>
        <text class="t-s" x="696" y="312">entries and gaps: what was</text>
        <text class="t-s" x="696" y="326">never collected is part of</text>
        <text class="t-s" x="696" y="340">the record</text>

        <line class="ln-a" x1="574" y1="303" x2="676" y2="303" marker-end="url(#ar-a)"/>
        <text class="t-s t-a" x="584" y="295">live board</text>

        <text class="t-s" x="24" y="390">every arrow is a parsed, contract-valid object. a bare exit code is not proof of a valid output, so the driver parses each stage before using it.</text>

      </svg>
