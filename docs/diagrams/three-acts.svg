<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 404" width="960" height="404" role="img" aria-label="Three acts. Act one at D plus 1 runs the Telemetry Analyst detect task and the Precedent Analyst recall task, both bounded at that day, so the working note written later in the incident is out of reach. Act two at the D plus 15 bridge runs the Change Correlator, whose correlation feeds the Incident Commander assess task alongside act one's typed precedent; the findings arrow is marked because no driver composes it. Act three is the directed change: the commander's mitigate task blocked pre-dispatch and the Scribe drafting the change record, which run from the governance driver and a standalone invocation, and the Scribe writing the timeline from the live board for the driver to file.">
  <title>Three acts. Act one at D plus 1 runs the Telemetry Analyst detect task and the Precedent Analyst recall task, both bounded at that day, so the working note written later in the incident is out of reach. Act two at the D plus 15 bridge runs the Change Correlator, whose correlation feeds the Incident Commander assess task alongside act one's typed precedent; the findings arrow is marked because no driver composes it. Act three is the directed change: the commander's mitigate task blocked pre-dispatch and the Scribe drafting the change record, which run from the governance driver and a standalone invocation, and the Scribe writing the timeline from the live board for the driver to file.</title>
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;fill:#131A1C}
    .t{font-size:11px}
    .t-b{font-size:11px;font-weight:600}
    .t-s{font-size:9.5px;fill:#6E7D7C}
    .t-e{font-size:9.5px;letter-spacing:.14em;fill:#6E7D7C}
    .t-n{font-size:13px;font-weight:600}
    .t-a{fill:#186B66}
    .t-h{fill:#A9491A}
    .box{fill:#FFFFFF;stroke:#C9D4D3;stroke-width:1.4}
    .box-a{fill:#DDECEA;stroke:#186B66;stroke-width:1.4}
    .box-h{fill:#F6E4D9;stroke:#A9491A;stroke-width:1.4}
    .box-g{fill:none;stroke:#C9D4D3;stroke-width:1.4;stroke-dasharray:4 4}
    .band{fill:#E6ECEB}
    .panel{fill:none;stroke:#C9D4D3;stroke-width:1.4}
    .ln{stroke:#6E7D7C;stroke-width:1.4;fill:none}
    .ln-a{stroke:#186B66;stroke-width:1.6;fill:none}
    .ln-h{stroke:#A9491A;stroke-width:1.6;fill:none}
    .ln-r{stroke:#C9D4D3;stroke-width:1.4;fill:none}
    .dash{stroke-dasharray:4 4}
    .mk{fill:#6E7D7C}
    .mk-a{fill:#186B66}
    .mk-h{fill:#A9491A}
    .faint{opacity:.42}
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mk"/></marker>
    <marker id="ar-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mk-a"/></marker>
    <marker id="ar-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mk-h"/></marker>
  </defs>
  <rect width="960" height="404" fill="#F7F9F9"/>


        <text class="t-e" x="24" y="34">ACT ONE  /  D+1</text>
        <text class="t-e" x="344" y="34">ACT TWO  /  D+15, THE BRIDGE</text>
        <text class="t-e" x="664" y="34">ACT THREE  /  THE DIRECTED CHANGE</text>

        <rect class="panel" x="24" y="52" width="256" height="314" rx="3"/>
        <rect class="panel" x="344" y="52" width="256" height="314" rx="3"/>
        <rect class="panel" x="664" y="52" width="256" height="314" rx="3"/>

        <rect class="box" x="38" y="74" width="228" height="76" rx="3"/>
        <text class="t-b" x="52" y="96">Telemetry Analyst</text>
        <text class="t-s t-a" x="52" y="112">detect  ·  telemetry</text>
        <text class="t-s" x="52" y="126">occurrence_count: 2</text>
        <text class="t-s" x="52" y="140">acknowledged_count: 0</text>

        <rect class="box" x="38" y="166" width="228" height="76" rx="3"/>
        <text class="t-b" x="52" y="188">Precedent Analyst</text>
        <text class="t-s t-a" x="52" y="204">recall  ·  precedent_archive</text>
        <text class="t-s" x="52" y="218">before = the view's as_of</text>
        <text class="t-s" x="52" y="232">refusal is a valid answer</text>

        <text class="t-s" x="52" y="278">the D+1 view holds two</text>
        <text class="t-s" x="52" y="292">auto-closed problems and</text>
        <text class="t-s" x="52" y="306">a metric series. nearly</text>
        <text class="t-s" x="52" y="320">empty, by design.</text>

        <rect class="box" x="358" y="74" width="228" height="76" rx="3"/>
        <text class="t-b" x="372" y="96">Change Correlator</text>
        <text class="t-s t-a" x="372" y="112">correlate  ·  change_registry</text>
        <text class="t-s" x="372" y="126">D-8 install, 8 days before</text>
        <text class="t-s" x="372" y="140">onset. never names a cause.</text>

        <line class="ln-a" x1="472" y1="150" x2="472" y2="252" marker-end="url(#ar-a)"/>
        <text class="t-s t-a" x="482" y="206">correlation</text>

        <rect class="box-a" x="358" y="258" width="228" height="90" rx="3"/>
        <text class="t-b" x="372" y="280">Incident Commander</text>
        <text class="t-s t-a" x="372" y="296">assess</text>
        <text class="t-s" x="372" y="312">hypotheses, blocking_evidence</text>
        <text class="t-s" x="372" y="326">attribution_guard</text>
        <text class="t-s" x="372" y="340">convergence_allowed: false while outstanding</text>

        <path class="ln-a" d="M266 112 H 306 V 286 H 352" marker-end="url(#ar-a)"/>
        <text class="t-s t-a" x="286" y="104">findings *</text>

        <path class="ln-a" d="M266 204 H 326 V 320 H 352" marker-end="url(#ar-a)"/>
        <text class="t-s t-a" x="286" y="196">precedent</text>

        <rect class="box-h" x="678" y="74" width="228" height="76" rx="3"/>
        <text class="t-b t-h" x="692" y="96">Incident Commander</text>
        <text class="t-s t-h" x="692" y="112">mitigate  ·  host, bound</text>
        <text class="t-s" x="692" y="126">SANDBOX_TOOL_VIOLATION</text>
        <text class="t-s" x="692" y="140">implemented: false</text>

        <line class="ln-h dash" x1="792" y1="150" x2="792" y2="162"/>

        <rect class="box" x="678" y="166" width="228" height="76" rx="3"/>
        <text class="t-b" x="692" y="188">Scribe</text>
        <text class="t-s t-a" x="692" y="204">draft_change_record  ·  sink</text>
        <text class="t-s" x="692" y="218">the blocked change is still</text>
        <text class="t-s" x="692" y="232">documented. submitted: false</text>

        <rect class="box" x="678" y="258" width="228" height="90" rx="3"/>
        <text class="t-b" x="692" y="280">Scribe</text>
        <text class="t-s t-a" x="692" y="296">timeline  ·  filed by the driver</text>
        <text class="t-s" x="692" y="312">entries and gaps: what was</text>
        <text class="t-s" x="692" y="326">never collected is part of</text>
        <text class="t-s" x="692" y="340">the record</text>

        <line class="ln-a" x1="586" y1="303" x2="672" y2="303" marker-end="url(#ar-a)"/>
        <text class="t-s t-a" x="600" y="295">live board</text>

        <text class="t-s" x="24" y="376">acts one and two are demos/investigate.sh. the blocked change is demos/governance.sh sandbox, and the draft record a standalone run.</text>
        <text class="t-s" x="24" y="390">every solid arrow is a parsed, contract-valid object composed by a driver. the dashed one is sequence, and findings is marked because no driver composes it.</text>

      </svg>
