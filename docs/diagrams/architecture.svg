<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 624" width="560" height="624" role="img" aria-label="Three evidence surfaces, each read by exactly one agent. The Telemetry Analyst, Change Correlator and Precedent Analyst hand typed correlation and precedent to the Incident Commander, with the Telemetry Analyst's findings marked as the one handoff the pipeline does not compose today, whose live board goes to the Scribe, whose timeline the driver files on the incident record sink, verified in the adapter log.">
  <title>Three evidence surfaces, each read by exactly one agent, handing typed output to the Incident Commander, whose board goes to the Scribe, whose timeline the driver files on the incident record sink.</title>
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;fill:#131A1C}
    .t{font-size:12px;font-weight:600}
    .s{font-size:10.5px;fill:#6E7D7C}
    .e{font-size:10px;letter-spacing:.13em;fill:#6E7D7C}
    .a{fill:#186B66}
    .box{fill:#FFFFFF;stroke:#C9D4D3;stroke-width:1.5}
    .box-a{fill:#DDECEA;stroke:#186B66;stroke-width:1.5}
    .ln{stroke:#6E7D7C;stroke-width:1.5;fill:none}
    .ln-a{stroke:#186B66;stroke-width:1.7;fill:none}
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6E7D7C"/></marker>
    <marker id="ar-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#186B66"/></marker>
  </defs>
  <rect width="560" height="606" fill="#F7F9F9"/>

  <text class="e" x="20" y="28">EVIDENCE SURFACES, ONE OWNING AGENT EACH</text>

  <rect class="box" x="20" y="40" width="168" height="52" rx="3"/>
  <text class="t" x="34" y="64">telemetry</text>
  <text class="s" x="34" y="80">8422</text>

  <rect class="box" x="196" y="40" width="168" height="52" rx="3"/>
  <text class="t" x="210" y="64">change_registry</text>
  <text class="s" x="210" y="80">8423</text>

  <rect class="box" x="372" y="40" width="168" height="52" rx="3"/>
  <text class="t" x="386" y="64">precedent_archive</text>
  <text class="s" x="386" y="80">8426</text>

  <line class="ln" x1="104" y1="92" x2="104" y2="122" marker-end="url(#ar)"/>
  <line class="ln" x1="280" y1="92" x2="280" y2="122" marker-end="url(#ar)"/>
  <line class="ln" x1="456" y1="92" x2="456" y2="122" marker-end="url(#ar)"/>

  <rect class="box" x="20" y="128" width="168" height="64" rx="3"/>
  <text class="t" x="34" y="152">Telemetry Analyst</text>
  <text class="s" x="34" y="170">detect</text>

  <rect class="box" x="196" y="128" width="168" height="64" rx="3"/>
  <text class="t" x="210" y="152">Change Correlator</text>
  <text class="s" x="210" y="170">correlate</text>

  <rect class="box" x="372" y="128" width="168" height="64" rx="3"/>
  <text class="t" x="386" y="152">Precedent Analyst</text>
  <text class="s" x="386" y="170">recall</text>

  <line class="ln-a" x1="104" y1="192" x2="104" y2="240"/>
  <line class="ln-a" x1="280" y1="192" x2="280" y2="240"/>
  <line class="ln-a" x1="456" y1="192" x2="456" y2="240"/>
  <line class="ln-a" x1="104" y1="240" x2="456" y2="240"/>
  <line class="ln-a" x1="280" y1="240" x2="280" y2="264" marker-end="url(#ar-a)"/>
  <text class="s a" x="110" y="214">findings *</text>
  <text class="s a" x="286" y="214">correlation</text>
  <text class="s a" x="462" y="214">precedent</text>

  <rect class="box-a" x="100" y="270" width="360" height="88" rx="3"/>
  <text class="t" x="118" y="294">Incident Commander</text>
  <text class="s" x="118" y="312">assess, brief, mitigate</text>
  <text class="s" x="118" y="330">every claim carries confidence</text>
  <text class="s" x="118" y="346">and falsifying_test</text>

  <line class="ln-a" x1="280" y1="358" x2="280" y2="388" marker-end="url(#ar-a)"/>
  <text class="s a" x="290" y="378">live board</text>

  <rect class="box" x="100" y="394" width="360" height="64" rx="3"/>
  <text class="t" x="118" y="418">Scribe</text>
  <text class="s" x="118" y="436">timeline, change record</text>

  <line class="ln" x1="280" y1="458" x2="280" y2="494" marker-end="url(#ar)"/>
  <text class="s" x="290" y="474">filed by the driver, verified in the log</text>

  <rect class="box" x="100" y="500" width="360" height="60" rx="3"/>
  <text class="t" x="118" y="524">incident_record sink</text>
  <text class="s" x="118" y="542">8425. draft only, no submit call</text>

  <text class="s" x="20" y="580">No agent reads another's evidence surface.</text>
  <text class="s" x="20" y="596">Every arrow between agents is a typed object.</text>
  <text class="s" x="20" y="612">* detect runs as its own act; the board reads the view's signals.</text>
</svg>
