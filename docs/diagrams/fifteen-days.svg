<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-label="Timeline from D minus 8 to D plus 16. A memory exhaustion problem is opened and auto-closed on thirteen of fifteen days while zero are acknowledged. Human attention begins only at D plus 15 when a business user raises a ticket, and the change correlation that was available the whole time is run two hours and twenty one minutes into the bridge call.">
  <title>Timeline from D minus 8 to D plus 16. A memory exhaustion problem is opened and auto-closed on thirteen of fifteen days while zero are acknowledged. Human attention begins only at D plus 15 when a business user raises a ticket, and the change correlation that was available the whole time is run two hours and twenty one minutes into the bridge call.</title>
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;fill:#131A1C}
    .t{font-size:11px}
    .t-b{font-size:11px;font-weight:600}
    .t-s{font-size:9.5px;fill:#6E7D7C}
    .t-e{font-size:9.5px;letter-spacing:.14em;fill:#6E7D7C}
    .t-n{font-size:13px;font-weight:600}
    .t-a{fill:#186B66}
    .t-h{fill:#A9491A}
    .box{fill:#FFFFFF;stroke:#C9D4D3;stroke-width:1.4}
    .box-a{fill:#DDECEA;stroke:#186B66;stroke-width:1.4}
    .box-h{fill:#F6E4D9;stroke:#A9491A;stroke-width:1.4}
    .box-g{fill:none;stroke:#C9D4D3;stroke-width:1.4;stroke-dasharray:4 4}
    .band{fill:#E6ECEB}
    .panel{fill:none;stroke:#C9D4D3;stroke-width:1.4}
    .ln{stroke:#6E7D7C;stroke-width:1.4;fill:none}
    .ln-a{stroke:#186B66;stroke-width:1.6;fill:none}
    .ln-h{stroke:#A9491A;stroke-width:1.6;fill:none}
    .ln-r{stroke:#C9D4D3;stroke-width:1.4;fill:none}
    .dash{stroke-dasharray:4 4}
    .mk{fill:#6E7D7C}
    .mk-a{fill:#186B66}
    .mk-h{fill:#A9491A}
    .faint{opacity:.42}
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mk"/></marker>
    <marker id="ar-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mk-a"/></marker>
    <marker id="ar-h" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="mk-h"/></marker>
  </defs>
  <rect width="960" height="360" fill="#F7F9F9"/>


        <text class="t-e" x="24" y="30">DETECTION, AUTOMATED</text>

        <line class="ln-r" x1="24" y1="196" x2="936" y2="196"/>

        <line class="ln dash" x1="96" y1="196" x2="96" y2="122"/>
        <rect class="box" x="88" y="188" width="16" height="16" transform="rotate(45 96 196)"/>
        <text class="t" x="26" y="86">D-8  change</text>
        <text class="t-s" x="26" y="100">compliance agent rolled out,</text>
        <text class="t-s" x="26" y="112">low risk, closed successful</text>

        <rect class="box-a" x="252" y="128" width="16" height="68"/>
        <rect class="box-a" x="286" y="128" width="16" height="68"/>
        <rect class="box-a" x="320" y="128" width="16" height="68"/>
        <rect class="box-a" x="354" y="128" width="16" height="68"/>
        <rect class="box-a" x="388" y="128" width="16" height="68"/>
        <rect class="box-g" x="422" y="128" width="16" height="68"/>
        <rect class="box-a" x="456" y="128" width="16" height="68"/>
        <rect class="box-a" x="490" y="128" width="16" height="68"/>
        <rect class="box-a" x="524" y="128" width="16" height="68"/>
        <rect class="box-a" x="558" y="128" width="16" height="68"/>
        <rect class="box-g" x="592" y="128" width="16" height="68"/>
        <rect class="box-a" x="626" y="128" width="16" height="68"/>
        <rect class="box-a" x="660" y="128" width="16" height="68"/>
        <rect class="box-a" x="694" y="128" width="16" height="68"/>
        <rect class="box-a" x="728" y="128" width="16" height="68"/>

        <text class="t t-a" x="252" y="118">memory-exhaustion problem opened and auto-closed, 13 of 15 days</text>

        <text class="t-s" x="252" y="216">D0  onset</text>
        <text class="t-s" x="744" y="216">D+15</text>

        <line class="ln-h" x1="796" y1="196" x2="796" y2="112"/>
        <circle class="mk-h" cx="796" cy="196" r="4"/>
        <text class="t t-h" x="806" y="104">D+15 16:40</text>
        <text class="t-s" x="806" y="118">a business user</text>
        <text class="t-s" x="806" y="130">raises a ticket</text>

        <text class="t-e" x="24" y="264">CONSUMPTION, HUMAN</text>
        <line class="ln dash" x1="252" y1="288" x2="784" y2="288"/>
        <text class="t" x="252" y="308">acknowledged: 0</text>
        <circle class="mk-h" cx="796" cy="288" r="4"/>
        <text class="t t-h" x="806" y="292">bridge, 17:00</text>

        <line class="ln dash" x1="96" y1="344" x2="782" y2="344" marker-end="url(#ar)"/>
        <text class="t-s" x="300" y="338">package history: one command, available the whole time, run at 19:21</text>

      </svg>
