# The generated artefacts in this repo are only trustworthy if drift is a
# test failure. Fixtures, the corpus index and the specs all have a check
# that already existed as a command someone had to remember to run.
name: checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  generated-artefacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fixture views match the generator
        run: |
          python3 fixtures/generate.py | diff -u fixtures/composite-incident.json -
          python3 fixtures/generate.py --at d1 | diff -u fixtures/composite-incident.d1.json -
          python3 fixtures/generate.py --demo attribution | diff -u fixtures/composite-incident.attribution.json -
          python3 fixtures/generate.py --demo mitigation | diff -u fixtures/mitigation-directive.json -
          python3 fixtures/generate.py --demo novel | diff -u fixtures/novel-incident.json -

      # The four rules that keep precedent out of the deciding slot are schema
      # rules, so they can be checked without a model. Until this ran, they
      # were exercised only when a live board happened to try one, which is a
      # test that fires when it feels like it and bills when it does.
      - name: Commander contract invariants and one confidence scale
        run: |
          pip install pyyaml jsonschema
          python3 checks/contract_invariants.py --self-test
          python3 checks/contract_invariants.py

      - name: The walkthrough's claim list cites checks that exist
        run: |
          pip install pyyaml jsonschema
          python3 checks/walkthrough_claims.py --self-test
          python3 checks/walkthrough_claims.py

      - name: Corpus documents match the generator
        run: |
          python3 fixtures/generate.py --corpus corpus/documents
          git diff --exit-code corpus/documents

      - name: Corpus index is current
        run: |
          python3 corpus/ingest.py --check
          python3 corpus/ingest.py --chunker fixed --check

      - name: Evidence controls, argument validation and provenance regressions
        run: python3 -m unittest discover -s tests -v

      - name: precedent_archive conformance, both chunkers
        run: |
          python3 corpus/eval.py
          python3 corpus/eval.py --index corpus/index.fixed.json

      # The eval dataset is hand-authored, which is the one artefact here with
      # no generator to diff against. Its claims about the corpus are checked
      # instead, so a document moving under it fails rather than leaving a
      # case that passes while testing nothing.
      - name: Eval dataset integrity, both chunkers
        run: |
          pip install pyyaml
          python3 evals/validate.py
          python3 evals/validate.py --index corpus/index.fixed.json

      # The results table is generated like everything else here, so it gets
      # the same treatment: a number in it that no longer follows from the
      # corpus, the dataset and the config is a failure rather than a stale
      # line nobody reread. Retrieval mode only, which needs no API key.
      - name: Retrieval baseline table is current
        run: python3 evals/runner.py --config evals/config.yaml --check

      # The baseline table is one index, so it cannot check a claim about two.
      # This scores both at every k and fails if the comparison has moved,
      # which is what stops that claim being a sentence nobody can falsify.
      - name: Chunker comparison is current
        run: python3 evals/runner.py --config evals/config.yaml --cross-check --check

      # Judgement mode itself cannot run here: it needs an API key and one
      # live model run per case, and its output is a record of one run rather
      # than a regenerable artefact. What can be checked is the one input it
      # derives. The query-strategy arm is the shipped system prompt with a
      # single paragraph replaced, and it is only an experiment while that
      # stays true, so the derivation is diffed like every other generated
      # file here.
      - name: Derived judgement prompts are current
        run: python3 evals/judgement.py --check-prompts

      # The Phase 5 grid is published in two documents and was typed into
      # both by hand, which is how a repo that generates every other number
      # ends up with an unrelated-claims figure of 6/22 where the record says
      # 3/22. It is generated from the three committed run records now: the
      # sweeps do not reproduce, but the records are files, so a table
      # derived from them is checkable like any other.
      # Also fails when a record was scored by a different version of
      # evals/judgement.py than this tree has, because the grid renders the
      # stored deterministic block: without that, a scoring change nobody
      # rescored would republish stale headline rates under a green check.
      - name: Judgement tables derived from the records are current
        run: python3 evals/judgement.py --comparison --check

  specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The contracts extra matters: from CLI 1.6.1, a task declaring a
      # behavioural_contract stops with CONTRACTS_UNAVAILABLE before the model
      # call when behavioural-contracts is unavailable.
      - name: Install the CLI
        run: pip install "open-agent-spec[contracts,otel]==1.6.2"

      - name: Retry wrapper retries the transport only, and adds no argument when agent traces are off
        run: bash checks/retry_probe.sh

      - name: Agent traces stage checks, free and without a key
        run: |
          python3 checks/agent_traces.py --self-test
          python3 checks/agent_traces.py --mutation-test

      - name: Local agent traces sink accepts protobuf exports
        run: python3 demos/agent_traces_sink.py --self-test

      # The indicators and the page are generated from committed spans, so a
      # stale sample would show numbers the current code no longer computes.
      - name: Agent traces indicators and report, self-tested and current
        run: |
          python3 checks/agent_traces_sli.py --self-test
          python3 checks/agent_traces_sli.py --mutation-test
          python3 demos/agent_traces_report.py --self-test
          for d in docs/samples/agent-traces-2026-10-08/*/; do
            python3 checks/agent_traces_sli.py "$d/spans.jsonl" --status-file "$d/status" \
              --check-output "$d/check.log" -o /tmp/sli.json
            cmp /tmp/sli.json "$d/sli.json"
            python3 demos/agent_traces_report.py "$d/sli.json" --check
          done
          python3 checks/agent_traces_sli.py --aggregate docs/samples/agent-traces-2026-10-08/*/sli.json -o /tmp/baseline.json
          cmp /tmp/baseline.json docs/samples/agent-traces-2026-10-08/baseline.json

      - name: Validate every spec
        run: |
          for spec in .agents/*.yaml; do
            oa validate --spec "$spec"
          done

      # `oa validate` cannot see this one: a prompt referencing a variable
      # that is not a required input is not invalid, it is two valid parts of
      # a spec disagreeing. The runner then hands the model the literal text
      # `{{ evidence }}` and the run still exits zero. The commander's brief
      # task shipped that way from the beginning because it had never been
      # run. Needs no key and no model, so it runs beside validation.
      - name: Prompt variables and required inputs agree
        run: |
          python3 checks/prompt_inputs.py --self-test
          python3 checks/prompt_inputs.py

      # The committed briefing carries only what its board gave it. Needs no
      # key and no model: it compares two committed files, which is the only
      # part of the briefing's central claim that is mechanically checkable.
      - name: Committed briefings match their boards where that is checkable
        run: |
          python3 checks/briefing_grounded.py --self-test
          python3 checks/briefing_grounded.py
