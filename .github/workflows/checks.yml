# The generated artefacts in this repo are only trustworthy if drift is a
# test failure. Fixtures, the corpus index and the specs all have a check
# that already existed as a command someone had to remember to run.
name: checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  generated-artefacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fixture views match the generator
        run: |
          python3 fixtures/generate.py | diff -u fixtures/composite-incident.json -
          python3 fixtures/generate.py --at d1 | diff -u fixtures/composite-incident.d1.json -
          python3 fixtures/generate.py --demo attribution | diff -u fixtures/composite-incident.attribution.json -
          python3 fixtures/generate.py --demo mitigation | diff -u fixtures/mitigation-directive.json -
          python3 fixtures/generate.py --demo novel | diff -u fixtures/novel-incident.json -

      - name: Corpus documents match the generator
        run: |
          python3 fixtures/generate.py --corpus corpus/documents
          git diff --exit-code corpus/documents

      - name: Corpus index is current
        run: |
          python3 corpus/ingest.py --check
          python3 corpus/ingest.py --chunker fixed --check

      - name: precedent_archive conformance, both chunkers
        run: |
          python3 corpus/eval.py
          python3 corpus/eval.py --index corpus/index.fixed.json

      # The eval dataset is hand-authored, which is the one artefact here with
      # no generator to diff against. Its claims about the corpus are checked
      # instead, so a document moving under it fails rather than leaving a
      # case that passes while testing nothing.
      - name: Eval dataset integrity, both chunkers
        run: |
          pip install pyyaml
          python3 evals/validate.py
          python3 evals/validate.py --index corpus/index.fixed.json

      # The results table is generated like everything else here, so it gets
      # the same treatment: a number in it that no longer follows from the
      # corpus, the dataset and the config is a failure rather than a stale
      # line nobody reread. Retrieval mode only, which needs no API key.
      - name: Retrieval baseline table is current
        run: python3 evals/runner.py --config evals/config.yaml --check

      # The baseline table is one index, so it cannot check a claim about two.
      # This scores both at every k and fails if the comparison has moved,
      # which is what stops that claim being a sentence nobody can falsify.
      - name: Chunker comparison is current
        run: python3 evals/runner.py --config evals/config.yaml --cross-check --check

      # Judgement mode itself cannot run here: it needs an API key and one
      # live model run per case, and its output is a record of one run rather
      # than a regenerable artefact. What can be checked is the one input it
      # derives. The query-strategy arm is the shipped system prompt with a
      # single paragraph replaced, and it is only an experiment while that
      # stays true, so the derivation is diffed like every other generated
      # file here.
      - name: Derived judgement prompts are current
        run: python3 evals/judgement.py --check-prompts

      # The Phase 5 grid is published in two documents and was typed into
      # both by hand, which is how a repo that generates every other number
      # ends up with an unrelated-claims figure of 6/22 where the record says
      # 3/22. It is generated from the three committed run records now: the
      # sweeps do not reproduce, but the records are files, so a table
      # derived from them is checkable like any other.
      - name: Judgement comparison grid is current
        run: python3 evals/judgement.py --comparison --check

  specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The contracts extra matters: without it contract validation skips
      # with a warning rather than failing, which is the fail-open behaviour
      # CLAUDE.md warns about.
      - name: Install the CLI
        run: pip install "open-agent-spec[contracts]==1.6.0"

      - name: Validate every spec
        run: |
          for spec in .agents/*.yaml; do
            oa validate --spec "$spec"
          done
